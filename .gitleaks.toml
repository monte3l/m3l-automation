# Extends gitleaks' default ruleset with repo-specific credential shapes.
# CI runs gitleaks-action (ci.yml "Secret scan"); it auto-loads this file from
# the repo root. Write-time counterpart: .claude/hooks/guard-secret-writes.mjs.
#
# No .gitleaksignore: a fingerprint there is `<commit>:<file>:<rule>:<line>`,
# and this repo squash-merges every PR, which rewrites the commit SHA a
# branch-authored fingerprint would key on — every entry ever added here went
# dead the moment its PR landed. A test that plants a secret-shaped literal on
# purpose (e.g. to prove a redactor strips it) must assemble it at runtime
# instead — .claude/rules/tests.md has the convention — so it never needs an
# ignore entry in the first place.
[extend]
useDefault = true

[[rules]]
id = "context7-api-key"
description = "Context7 API key (MCP server config — must stay in the user env, never committed; ADR-0030)"
regex = '''\bctx7sk-[A-Za-z0-9-]{20,}\b'''
keywords = ["ctx7sk-"]
