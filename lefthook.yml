# Git hooks, managed by Lefthook (replaces husky + lint-staged).
# Install/refresh with `pnpm exec lefthook install` (wired into `prepare`).
# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "**/*.ts"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "**/*.{ts,json,md,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: node bin/lint-commit.mjs --edit {1}

# Same whole-repo verify the old single-chain hook ran, split into independent
# commands so lefthook runs them CONCURRENTLY (`parallel: true`). Wall-clock drops
# from the sum of the steps to roughly the slowest lane — the fix for the multi-
# minute serial run that was overrunning push timeouts. Tradeoffs of parallelising:
# a cheap failure (e.g. format:check) no longer short-circuits before the expensive
# test run, and vitest+eslint+tsc now run at once (more CPU/RAM). Worth it — the
# all-pass push is the case that timed out. Every command's token set must stay
# mirrored in the CLAUDE.md cadence table's `pre-push` row — `check:cadence` diffs
# the two both ways.
pre-push:
  parallel: true
  commands:
    format:
      run: pnpm format:check
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    # check:test-counts is chained here rather than given its own lane: it spawns
    # a Vitest collection pass, and as a sibling lane that ran concurrently with
    # test:coverage's two full suite runs, contending for the same machine until
    # it intermittently exited non-zero and blamed the tests (F15, issue #489).
    # Chaining costs no wall-clock — the collection pass is ~5s against lint's
    # ~26s, so this lane stays well off the critical path. `check:cadence`
    # compares the token SET per stage, so both tokens still count as pre-push.
    test:
      run: pnpm test:coverage && pnpm check:test-counts
    # build + check:exports catch a broken compile or exports map (publint / attw)
    # locally instead of first in CI. Kept in ONE command so build's dist/ output
    # precedes the pack — the single hard ordering dependency (lefthook has no
    # per-command DAG). build is turbo-cached, so its marginal cost is small.
    build-exports:
      run: pnpm build && pnpm check:exports
    # Refuse to push unsigned/unverified commits (skipped in CI so release
    # automation isn't wedged). Bypassable with --no-verify; the unbypassable
    # layer is branch-protection "Require signed commits" (ADR-0016).
    verify-signatures:
      run: node bin/verify-signed-range.mjs
    # A literal control byte makes a file binary to git, so it cannot be
    # reviewed at all — this is the one gate whose whole value is firing BEFORE
    # the file reaches a reviewer, and it costs ~0.2s.
    check-control-chars:
      run: pnpm check:control-chars
    # ADR-0072's per-file size ratchet. Was CI-only, which meant a 6-byte
    # overrun was discovered only after a push with all eleven other pre-push
    # gates green (#604). Costs ~0.05s.
    check-file-budget:
      run: pnpm check:file-budget
    # Catch agent/model-matrix drift locally instead of first in CI (was
    # CI-only; see docs/contributing/model-selection.md "Enforcement").
    check-agents:
      run: pnpm check:agents
    # Catch script README / reference-page structure drift locally instead of
    # first in CI (section presence, contract blockquote, example count,
    # Operation column header, Validation column header). See
    # docs/contributing/script-docs-structure.md.
    check-script-docs:
      run: pnpm check:script-docs
    # Same rationale one surface over: the CLI contract page's structure gate
    # is cheap (~0.05s) and is the one a contributor trips by adding a command
    # to main.ts without documenting it. See docs/contributing/cli-structure.md.
    # Its sibling check:cli-scaffold stays CI-only, mirroring the
    # check:script-docs / check:script-scaffold split.
    check-cli-docs:
      run: pnpm check:cli-docs
    # Reproduces claude-pr-review.yml's own reviewable-size gate locally
    # (ADR-0072), before the CI review job ever spends a turn on an
    # oversized PR. Resolves origin/main...HEAD itself when run bare; skips
    # gracefully (never blocks) when that range can't be resolved.
    check-review-size:
      run: pnpm check:review-size

# Fire after `git rebase` completes (including a no-op rebase with nothing to
# replay) and after `git merge` completes. Regenerates the derived files the
# m3l-generated merge driver (.gitattributes, ADR-0024) deliberately left
# un-regenerated, then reports dirty files for a `docs: reconcile doc
# metadata` commit — never auto-commits, never blocks (always exits 0).
post-rewrite:
  commands:
    regen:
      run: node bin/post-integrate-regen.mjs

post-merge:
  commands:
    regen:
      run: node bin/post-integrate-regen.mjs
