# Git hooks, managed by Lefthook (replaces husky + lint-staged).
# Install/refresh with `pnpm exec lefthook install` (wired into `prepare`).
# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "**/*.ts"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "**/*.{ts,json,md,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: node bin/lint-commit.mjs --edit {1}

# Same whole-repo verify the old single-chain hook ran, split into independent
# commands so lefthook runs them CONCURRENTLY (`parallel: true`). Wall-clock drops
# from the sum of the steps to roughly the slowest lane — the fix for the multi-
# minute serial run that was overrunning push timeouts. Tradeoffs of parallelising:
# a cheap failure (e.g. format:check) no longer short-circuits before the expensive
# test run, and vitest+eslint+tsc now run at once (more CPU/RAM). Worth it — the
# all-pass push is the case that timed out. Every command's token set must stay
# mirrored in the CLAUDE.md cadence table's `pre-push` row — `check:cadence` diffs
# the two both ways (it compares the token SET per stage, not lane names or
# groupings, so chaining several checks into one lane below changes nothing there).
#
# ADR-0080: on a memory-constrained host, `parallel: true` here plus turbo's own
# fan-out (capped 50%, turbo.json) and vitest's own fan-out (capped 50%,
# vitest.config.ts) can still stack three heavy lanes (test/typecheck/build-exports)
# concurrently. `bin/setup-host-resources.mjs` writes a gitignored
# `lefthook-local.yml` forcing `pre-push: parallel: false` when the host has under
# ~20 GiB RAM — lefthook's own documented local-override mechanism
# (https://lefthook.dev/examples/lefthook-local), not a change to this shared file.
pre-push:
  parallel: true
  commands:
    format:
      run: pnpm format:check
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    # check:test-counts is chained here rather than given its own lane: it spawns
    # a Vitest collection pass, and as a sibling lane that ran concurrently with
    # test:coverage's two full suite runs, contending for the same machine until
    # it intermittently exited non-zero and blamed the tests (F15, issue #489).
    # Chaining costs no wall-clock — the collection pass is ~5s against lint's
    # ~26s, so this lane stays well off the critical path.
    test:
      run: pnpm test:coverage && pnpm check:test-counts
    # build + check:exports catch a broken compile or exports map (publint / attw)
    # locally instead of first in CI. Kept in ONE command so build's dist/ output
    # precedes the pack — the single hard ordering dependency (lefthook has no
    # per-command DAG). build is turbo-cached, so its marginal cost is small.
    build-exports:
      run: pnpm build && pnpm check:exports
    # ADR-0080: the eight gates below were each their own top-level lane (13
    # total pre-push lanes with format/lint/typecheck/test/build-exports above),
    # every one of them sub-second and none ever on the critical path (the
    # slowest of the eight, check:agents, runs in ~7s against lint's ~4 minutes).
    # Chaining them into one lane cuts pre-push from 13 concurrent lefthook-spawned
    # processes to 6 with no wall-clock cost — the same "chain a cheap check,
    # costs nothing" reasoning as the `test` lane's check:test-counts above.
    # Each check's own rationale for existing lives in its bin/check-*.mjs
    # header comment (not duplicated here); this lane's `run:` must stay a
    # single PHYSICAL line — check-cadence-doc.mjs's line-based parser only
    # captures text on the same line as `run:` (no real YAML parsing), so ANY
    # multi-line scalar here (block `|`, folded `>`, or a folded `>-` that
    # still wraps across lines) silently drops every chained check from the
    # cadence-doc comparison. Verified: `pnpm check:cadence` after this change.
    checks:
      run: node bin/verify-signed-range.mjs && pnpm check:control-chars && pnpm check:file-budget && pnpm check:agents && pnpm check:script-docs && pnpm check:cli-docs && pnpm check:review-size && pnpm check:context-budget

# Fire after `git rebase` completes (including a no-op rebase with nothing to
# replay) and after `git merge` completes. Regenerates the derived files the
# m3l-generated merge driver (.gitattributes, ADR-0024) deliberately left
# un-regenerated, then reports dirty files for a `docs: reconcile doc
# metadata` commit — never auto-commits, never blocks (always exits 0).
post-rewrite:
  commands:
    regen:
      run: node bin/post-integrate-regen.mjs

post-merge:
  commands:
    regen:
      run: node bin/post-integrate-regen.mjs
