# Git hooks, managed by Lefthook (replaces husky + lint-staged).
# Install/refresh with `pnpm exec lefthook install` (wired into `prepare`).
# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "**/*.ts"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "**/*.{ts,json,md,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      # strip-claude-trailers runs FIRST and silently deletes any harness-
      # injected Claude-* trailer (Claude-Session:, etc. — never Co-Authored-By)
      # before lint-commit validates the message; lint-commit's own
      # validateForbiddenTrailers() is the backstop if one somehow survives.
      run: node bin/strip-claude-trailers.mjs {1} && node bin/lint-commit.mjs --edit {1}

# Same whole-repo verify the old single-chain hook ran, split into independent
# commands so lefthook runs them CONCURRENTLY (`parallel: true`). Wall-clock drops
# from the sum of the steps to roughly the slowest lane — the fix for the multi-
# minute serial run that was overrunning push timeouts. Tradeoffs of parallelising:
# a cheap failure (e.g. format:check) no longer short-circuits before the expensive
# test run, and vitest+eslint+tsc now run at once (more CPU/RAM). Worth it — the
# all-pass push is the case that timed out. Every command's token set must stay
# mirrored in the CLAUDE.md cadence table's `pre-push` row — `check:cadence` diffs
# the two both ways (it compares the token SET per stage, not lane names or
# groupings, so chaining several checks into one lane below changes nothing there).
#
# ADR-0080: on a memory-constrained host, `parallel: true` here plus turbo's own
# fan-out (capped 50%, turbo.json) and vitest's own fan-out (capped 50%,
# vitest.config.ts) can still stack three heavy lanes (test/typecheck/build-exports)
# concurrently. `bin/setup-host-resources.mjs` writes a gitignored
# `lefthook-local.yml` forcing `pre-push: parallel: false` when the host has under
# ~20 GiB RAM — lefthook's own documented local-override mechanism
# (https://lefthook.dev/examples/lefthook-local), not a change to this shared file.
pre-push:
  parallel: true
  commands:
    format:
      run: pnpm format:check
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    # check:test-counts is chained here rather than given its own lane: it spawns
    # a Vitest collection pass, and as a sibling lane that ran concurrently with
    # test:coverage's two full suite runs, contending for the same machine until
    # it intermittently exited non-zero and blamed the tests (F15, issue #489).
    # Chaining costs no wall-clock — the collection pass is ~5s against lint's
    # ~26s, so this lane stays well off the critical path.
    test:
      run: pnpm test:coverage && pnpm check:test-counts
    # build + check:exports catch a broken compile or exports map (publint / attw)
    # locally instead of first in CI. Kept in ONE command so build's dist/ output
    # precedes the pack — the single hard ordering dependency (lefthook has no
    # per-command DAG). build is turbo-cached, so its marginal cost is small.
    build-exports:
      run: pnpm build && pnpm check:exports
    # ADR-0080: the eight gates below were each their own top-level lane (13
    # total pre-push lanes with format/lint/typecheck/test/build-exports above),
    # every one of them sub-second and none ever on the critical path (the
    # slowest of the eight, check:agents, runs in ~7s against lint's ~4 minutes).
    # Chaining them into one lane cuts pre-push from 13 concurrent lefthook-spawned
    # processes to 6 with no wall-clock cost — the same "chain a cheap check,
    # costs nothing" reasoning as the `test` lane's check:test-counts above.
    # Each check's own rationale for existing lives in its bin/check-*.mjs
    # header comment (not duplicated here); this lane's `run:` must stay a
    # single PHYSICAL line — check-cadence-doc.mjs's line-based parser only
    # captures text on the same line as `run:` (no real YAML parsing), so ANY
    # multi-line scalar here (block `|`, folded `>`, or a folded `>-` that
    # still wraps across lines) silently drops every chained check from the
    # cadence-doc comparison. Verified: `pnpm check:cadence` after this change.
    #
    # check:provenance and check:index joined this lane after PR #736 went red
    # in CI twice for the same reason: both gates anchor a symbol to a source
    # FILE PATH (provenance sidecars' sources[].file, symbol-map.json's file),
    # so any refactor that relocates an exported symbol invalidates them — and
    # both were CI-only, so a fully green pre-push was no evidence either way.
    # They cost ~0.15s combined, well inside this lane's slack.
    #
    # check:harness-freshness (ADR-0082) joined the same way: it reads one
    # local file's header comment, makes no network call, and always exits 0
    # (advisory-only, like check:context-budget above) — negligible cost, and
    # a warning surfaced here is a warning a maintainer sees before push
    # rather than never, since nothing else in the repo polls the tracker.
    # check:retrospective (ADR-0084) joined for the same reason as
    # check:harness-freshness directly above: offline, always exits 0, and it
    # reads ~50 small files plus one header comment. It is the ONLY gate that
    # looks outside the repo (the auto-memory store lives in ~/.claude), so
    # `pre-push` is the only place it can ever run — CI has no such store and
    # the gate no-ops there.
    # check:hooks joined the same way: it was CI-only, meaning a locally
    # green pre-push was no evidence a broken hook wiring (a bad event name,
    # a missing script, or — since this addition — an unrecognized `matcher`
    # value on SessionStart/PreCompact/PostCompact) hadn't slipped through.
    # A matcher typo can silently disable the ADR-0078 compaction-handoff
    # re-injection with no other symptom. Reads settings.json and the hooks
    # dir, no network call, negligible cost.
    # check:skill-frontmatter joined the same way: it reads 22 small SKILL.md
    # files plus one catalog doc, no network call, negligible cost. It closes
    # the gap check:agents already covers for .claude/agents/*.md (a hard
    # fail on an empty description) but had no skill-side equivalent for —
    # collectSkillDescriptions in check-context-budget.mjs reads `description`
    # only to measure length, so an empty one there silently passed as
    # `chars: 0` — plus a name-matches-directory check and catalog-coverage
    # check with no prior equivalent (finishing-work shipped with no catalog
    # row and nothing caught it, docs/logs/2026-09-02-finishing-work-skill.md).
    # check:no-docker (ADR-0091) joined the same way: it reads only the git
    # index and the working tree, no network or auth, negligible cost. It
    # enforces the Docker-ban stance at the point a violation is cheapest to
    # catch — before it reaches CI — rather than leaving it a prose-only rule.
    # check:staleness (issue #995 / ROADMAP H2) joined the same way: it warns
    # (non-blocking) on post-merge residue — a stale worktree, local branch,
    # remote-tracking ref, or tmp/ file — reusing bin/lib/worktree-prune.mjs's
    # signals rather than re-deriving them. It also runs from post-merge/
    # post-rewrite below (the actual "just merged" moment); this pre-push copy
    # catches drift for a maintainer who never pulls in the shared checkout.
    checks:
      run: node bin/verify-signed-range.mjs && node bin/check-commit-trailers.mjs && pnpm check:control-chars && pnpm check:no-docker && pnpm check:file-budget && pnpm check:agents && pnpm check:script-docs && pnpm check:cli-docs && pnpm check:review-size && pnpm check:context-budget && pnpm check:provenance && pnpm check:index && pnpm check:harness-freshness && pnpm check:retrospective && pnpm check:staleness && pnpm check:skill-evals && pnpm check:claude-cli-version && pnpm check:review-policy && pnpm check:hooks && pnpm check:skill-frontmatter

# Fire after `git rebase` completes (including a no-op rebase with nothing to
# replay) and after `git merge` completes. Regenerates the derived files the
# m3l-generated merge driver (.gitattributes, ADR-0024) deliberately left
# un-regenerated, then reports dirty files for a `docs: reconcile doc
# metadata` commit — never auto-commits, never blocks (always exits 0).
#
# check:staleness (issue #995 / ROADMAP H2) is chained after regen: this is
# the literal "just merged/rebased" moment a maintainer can actually act on
# post-merge residue, and `finishing-work` is invoked manually rather than
# hook-triggered, so nothing else catches it here. Advisory only, always
# exits 0 — never blocks the rebase/merge that just completed.
post-rewrite:
  commands:
    regen:
      run: node bin/post-integrate-regen.mjs && pnpm check:staleness

post-merge:
  commands:
    regen:
      run: node bin/post-integrate-regen.mjs && pnpm check:staleness
