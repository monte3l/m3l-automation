# nginx config for the console frontend image (ADR-0071, X12/issue #560).
# Mirrors vite.config.ts's dev-server proxy (same three prefixes, same
# upstream) so the built bundle behaves identically to `pnpm console:web`.
#
# `server` and `web` share a network namespace natively — they're two
# containers in one Pod (console-pod.yaml, ADR-0091) — so 127.0.0.1:8787
# genuinely reaches the console server from inside this container. See
# ADR-0071's Updates for the full rationale (originally a compose
# `network_mode: "service:server"` emulating this same shape).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cheap, safe-by-default hardening for a browser-facing surface — no CSP
    # here, since a correct one depends on the built bundle's own inline/asset
    # shape and risks breaking the SPA if approximated.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # SPA fallback: client-side routing (ADR-0067's routing/ module) owns
    # every path that isn't a static asset or one of the upstream routes below.
    location / {
        try_files $uri /index.html;
    }

    location /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    # Covers every /api/v1/* route, including the SSE live-tail stream
    # (/api/v1/runs/:id/stream, stream/event-stream.ts) — the console's
    # headline live feature and the reason this image is nginx rather than a
    # bare static file server.
    location /api {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_http_version 1.1;

        # SSE must not be buffered, cached, or timed out on idle — a
        # buffered/cached response never flushes an event as it arrives, and
        # the default proxy_read_timeout would cut a quiet-but-alive stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
    }
}
