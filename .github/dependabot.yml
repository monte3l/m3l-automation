version: 2
updates:
  # Weekly grouped version updates for all devDependencies.
  # Security updates (advisory-triggered) run separately and bypass grouping.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    groups:
      toolchain:
        patterns:
          - typescript
          - typescript-eslint
          - eslint
          - eslint-*
          - "@eslint/*"
          - "@types/*"
          - prettier
          - vitest
          - "@vitest/*"
          - turbo
          - lefthook
          - knip
          - publint
          - "@arethetypeswrong/*"
      commit-tooling:
        patterns:
          - commitlint
          - "@commitlint/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
    # Version-anchored rather than `update-types`-anchored on purpose. An
    # `update-types: [version-update:semver-major]` rule is evaluated against
    # whatever the manifest declares at run time, and merging a change to THIS
    # FILE triggers an immediate Dependabot run — so an ignore rule that landed
    # before the matching pin would classify e.g. 26.1.1 -> 26.4.0 as a *minor*,
    # wave it through, and clobber the pin. A `versions:` range is
    # manifest-independent, so ordering stops mattering and the constraint reads
    # as the intent ("the Node 24 line only") rather than as a delta.
    #
    # Both entries are mirrored in bin/check-deps.mjs's MAJOR_HOLDS, which
    # carries the full rationale. Neither is enforcement on its own: an ignore
    # rule suppresses a *proposal*, not a *state*. @types/node is genuinely
    # enforced by check:node-version's findTypesNodeDrift.
    ignore:
      # .node-version pins the dev/CI runtime to Node 24, and @types/node is
      # what decides which API surface `pnpm typecheck` validates against.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # TS 7 (the native port) needs its own ADR: typescript-eslint peer-caps
      # typescript at <6.1.0, and TS 7 reshapes the compiler API that
      # bin/lib/browser-safe-subpath.mjs depends on.
      - dependency-name: "typescript"
        versions: [">=7"]
    labels:
      - dependencies
    open-pull-requests-limit: 5

  # GitHub Actions are SHA-pinned (supply-chain hardening, ADR-0015). Pinning
  # freezes them, so Dependabot must track this ecosystem to keep the pinned
  # SHAs — and their trailing `# vX` comments — current as upstream releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  # ADR-0071 (X12/issue #560): base images in both console Dockerfiles
  # (`node:24-slim`, `nginxinc/nginx-unprivileged:1-alpine`), one entry per
  # directory containing a Dockerfile per Dependabot's docker ecosystem
  # convention. Neither image is published anywhere; this only tracks the
  # local build inputs.
  #
  # Both `node` ignore entries mirror the npm ecosystem's `@types/node` hold
  # above and `bin/check-deps.mjs`'s MAJOR_HOLDS: `.node-version` pins the
  # dev/CI runtime to 24, and shipping a `node:26-slim` image while
  # typechecking against `@types/node` 24 would let an unchallenged
  # Node-26-only API into a runtime image whose declared floor is 24. Raise
  # all three together whenever `.node-version` moves.
  - package-ecosystem: docker
    directory: /packages/m3l-console-server
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    ignore:
      - dependency-name: "node"
        versions: [">=25"]
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /packages/m3l-console-web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    ignore:
      - dependency-name: "node"
        versions: [">=25"]
    labels:
      - dependencies
    open-pull-requests-limit: 5
