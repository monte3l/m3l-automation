name: Claude Code Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    # This job carries the broadest token in the repo (contents/PRs/issues
    # write) and is triggered by any @claude mention — without a cap it
    # inherits GitHub's 360-minute default, effectively no limit. Matches
    # claude-pr-review.yml's budget for the same class of on-demand task.
    timeout-minutes: 45
    # Job-level, not workflow-level: workflow-level concurrency is evaluated
    # at run creation, before the `if:` above, so it would cancel an
    # in-flight @claude run whenever ANY comment (not just an @claude one)
    # posts on the same issue/PR. A job-level group is only entered once the
    # `if:` passes, so a skipped run never touches it.
    concurrency:
      group: claude-assistant-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@dcb57747bfceeaa1fa72638cae52295d1d853d4a # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-sonnet-5"
