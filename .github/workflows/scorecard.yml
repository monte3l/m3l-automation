# OpenSSF Scorecard — supply-chain posture scoring for this public repository
# (ADR-0015; the package itself is internal/unpublished per ADR-0020).
# Complements CodeQL (code) and dependency-review (deps) by
# grading repo-level hygiene: branch protection, pinned dependencies, token
# permissions, and dangerous-workflow patterns. Results upload as SARIF so they
# surface in the existing Security tab alongside CodeQL.
name: Scorecard

on:
  # Weekly scheduled scan (the branch-protection / token checks need the full
  # repo context a scheduled run gets) plus a scan on every push to main.
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]

# Top-level: least privilege. Elevated scopes are granted per-job below.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload SARIF results to the code-scanning / Security tab.
      security-events: write
      # Read the OIDC token so Scorecard can publish the signed result.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish the score to the public OpenSSF API (drives the README badge
          # and the API endpoint). Requires the id-token permission above.
          publish_results: true

      # Retain the raw SARIF as an artifact for debugging a low score.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v3
        with:
          sarif_file: results.sarif
