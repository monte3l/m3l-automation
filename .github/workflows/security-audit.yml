# Scheduled dependency security audit. ci.yml already runs `pnpm audit
# --audit-level=high` and `pnpm check:licenses` on every push/PR to main, but
# only against the dependency tree as it exists at that commit — a repo that
# goes quiet sits on an advisory published later against an unchanged
# lockfile until the next push. This workflow re-runs the same two checks on
# a schedule so a newly published HIGH/CRITICAL advisory or a license change
# surfaces even without new commits.
name: Security Audit (Scheduled)

on:
  schedule:
    - cron: "0 9 * * 1" # Mon 09:00 UTC — same cadence as Scorecard.
  workflow_dispatch:

permissions:
  contents: read

# A repeated manual dispatch stacks runs otherwise; cancel-in-progress stays
# false so a scheduled audit is never killed mid-run by a later trigger.
concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Dependency audit + license check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Same gate as ci.yml's "Security audit" step — re-run here on a
      # schedule so a newly published advisory against an unchanged lockfile
      # is caught between pushes.
      - name: Security audit
        run: pnpm audit --audit-level=high

      # ADR-0036: same license-compliance gate as ci.yml's "Check dependency
      # licenses" step.
      - name: Check dependency licenses
        run: pnpm check:licenses

  # ADR-0071/ADR-0015 (2026-09-03 Updates, X12/issue #560): the repo now
  # builds two container images but publishes neither, so Trivy runs here on
  # the same weekly schedule rather than as a per-PR required check — every
  # container-touching PR would otherwise pay a full image build on top of
  # ci.yml's existing quality-gate pipeline. Not part of `ci.yml`.
  container-scan:
    name: Build + scan container images with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: m3l-console-server
            dockerfile: packages/m3l-console-server/Dockerfile
          - image: m3l-console-web
            dockerfile: packages/m3l-console-web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.image }} image
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }}:scan .

      # HIGH/CRITICAL with a known fix, same threshold as the `audit` job's
      # `pnpm audit --audit-level=high` above — an unfixable finding would
      # just be noise this job can't act on.
      - name: Scan ${{ matrix.image }} with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          # Without this, trivy-action's entrypoint unsets TRIVY_SEVERITY
          # entirely for the `sarif` format, so `severity` above binds
          # NEITHER the SARIF output NOR the exit-code decision — every
          # fixable finding of any severity would fail the job, not just
          # HIGH/CRITICAL. This makes both honor the stated threshold.
          limit-severities-for-sarif: "true"
          ignore-unfixed: "true"
          exit-code: "1"

      - name: Upload Trivy SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  # The repo's Actions cache budget (10 GB) was measured at 10.44 GB / 112
  # active caches, with the pnpm store cache — the one that keeps ci.yml's
  # install step at ~5s — as the LRU eviction candidate behind 63 CodeQL
  # overlay databases (7.6 GB) and 27 claude-code-action `bun-*` caches
  # (871 MB). This job prunes the two prefixes this repo's own workflows
  # control, keeping only the 3 most-recently-accessed entries per prefix.
  # Deliberately does NOT touch `codeql-overlay-*` — GitHub's own CodeQL
  # default setup manages that cache family on its own schedule; deleting it
  # out from under default setup is not this workflow's call to make.
  prune-caches:
    name: Prune stale Actions caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete stale node-cache-* / bun-* entries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for prefix in "node-cache-" "bun-"; do
            gh api --paginate "repos/${REPO}/actions/caches?per_page=100" \
              --jq ".actions_caches[] | select(.key | startswith(\"${prefix}\")) | \"\(.last_accessed_at)\t\(.id)\t\(.key)\"" \
              | sort -r \
              | tail -n +4 \
              | while IFS=$'\t' read -r _ id key; do
                  echo "Deleting stale cache: ${key} (id ${id})"
                  gh api --method DELETE "repos/${REPO}/actions/caches/${id}" || true
                done
          done
