name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Anthropic publishes no recommended value; reviews average ~20 minutes
    # per code.claude.com/docs/en/code-review — 45 gives headroom for this
    # repo's largest observed PRs without leaving the GitHub default
    # (360min) as an effective non-limit. Wall time has never been the
    # binding constraint: the three runs that failed on PR #523 used
    # 188-296s of this budget and died on TURNS, not time. See
    # docs/research/pr-review-action-tuning.md.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      # Single source of truth for the turn cap: referenced by claude_args
      # and by the metrics step's summary/threshold below, so the two can
      # no longer drift (they were hand-synced across four sites before).
      #
      # 60 replaces 35. The old value came from "observed max 28/100" when
      # it shipped, but by 2026-08-20 the last six runs that actually
      # reviewed had used 20, 24, 28, 31, 32 and 34 turns — up to 97% of
      # cap, i.e. no margin at all — and ~30% of every budget was being
      # burned on permission denials. Turns are a cap, not a target: a
      # converged review stops early, so raising this does not raise
      # typical cost. It buys headroom so one unlucky retry loop stops
      # costing a whole $2.50 run.
      MAX_TURNS: 60
      # Above this many characters of *reviewable* patch (after the
      # ignore-predicate filter in the pre-compute step), no single-pass
      # review can be faithful, so the gate fails fast with an actionable
      # message instead of burning a full budget and dying on max turns.
      #
      # 300000 is ~2.1x the largest reviewable patch in the measured
      # window (142,557 chars, `b5eeb8c`) and clears every PR merged in it.
      #
      # Measured on a deduplicated unified diff. Until the `--patch`
      # removal below, the gate measured the per-commit patch series, so
      # every multi-commit PR was over-measured in proportion to its commit
      # count. The 142,557 calibration was always clean (squashed
      # single-commit diffs), so the limit itself never moved — that fix
      # made the gate finally measure what the calibration assumed.
      MAX_REVIEWABLE_BYTES: 300000
      # How many claude[bot] review comments a PR may accumulate before the
      # guard step stops triggering another review and escalates to a human
      # instead (see the guard step's round-limit check). 3 means rounds 1-3
      # run normally; a 4th would-be round is where the loop escalates. The
      # 2026-07-13 audit found PR #839 needed 4 rounds to converge and
      # #822/#787 each burned 4 full reviews on churn — a non-converging loop
      # should stop spending turns/tokens on repetition and hand off to
      # `docs/contributing/branch-protection.md`'s override procedure, not
      # run forever. Tunable; revisit if 3 proves too tight or too loose once
      # this has real data behind it.
      MAX_REVIEW_ROUNDS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Every one of this job's trust-sensitive artifacts is a plain
      # checkout-relative file — including `.claude-review-verdict` (an
      # unstamped copy is trusted unconditionally by resolveVerdict()) and
      # `.claude-prior-mustfix.md` (its mere EXISTENCE is the prompt's delta
      # re-review signal, see the "What to review" section below). Neither
      # is gitignored. A PR author can commit a file with either exact name
      # into their own branch, and it survives the checkout above completely
      # untouched by any later step — every later write uses `>` (truncate
      # on open), never checks the file didn't already exist, and the guard
      # step's own writes only happen conditionally. A committed
      # `.claude-review-verdict` containing `PASS` bypasses the SHA pin
      # specifically because an unstamped verdict carries no per-commit
      # provenance to check; a committed `.claude-prior-mustfix.md` gets fed
      # to the reviewer as trusted "prior round Must-fix items" on a PR's
      # very first, full-diff review, alongside an instruction that "the
      # rest of the PR already passed and does not need re-reading" — a
      # prompt-injection / review-bypass vector. Removing every artifact
      # this job ever writes, immediately after checkout and before any
      # other step runs, closes this for good: every one of these files can
      # now only ever be workflow-authored for the run in progress.
      - name: Clear any committed workflow artifacts
        run: |
          rm -f \
            .claude-review-verdict \
            .claude-review-comment.md \
            .claude-prior-mustfix.md \
            .claude-pr-diff.patch \
            .claude-pr-changed-files.txt \
            .claude-guard-comments.json \
            .claude-guard-comments.err \
            .claude-enforce-comments.json \
            .claude-enforce-comments.err \
            .claude-oversize-comment.md \
            .claude-autopass-comment.md \
            .claude-round-limit-comment.md

      # Skip a full re-review when the prior verdict was PASS and nothing
      # reviewable has changed since. The job still runs (so the required
      # `review` check always reports); only the Claude step below is gated.
      # Fail-safe: any ambiguity defaults to should_review=true so the gate is
      # never silently weakened. See docs/contributing/branch-protection.md.
      - name: Check prior review verdict
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # There is no top-level `paths-ignore` trigger filter — the job must
          # run (and report a status) on every non-draft PR touching main, so
          # the ignore set alone decides what's reviewable, for both a
          # brand-new PR (Gate 0 below) and a re-review since the last PASS
          # (further down).
          #
          # That set lives in bin/lib/pr-diff-filter.mjs and is reached through
          # `bin/pr-diff-filter.mjs reviewable`. It used to be hand-copied into
          # this step, the awk filter below, and the changed-file filter below
          # that — three copies the file told you to keep "in lockstep", which
          # had already drifted. `node` is safe to call here: actions/checkout
          # is itself a JavaScript action, so the runner cannot run this job
          # without it.
          review() {
            echo "should_review=true" >> "$GITHUB_OUTPUT"
            echo "$1"
          }

          # Gate 0: is there anything reviewable in the PR at all, regardless
          # of review history? Must run BEFORE the prior-comment check below,
          # so a brand-new, 100%-docs PR short-circuits here on its first push
          # instead of falling into "no prior comment" and triggering a real
          # review. Fail-safe: any ambiguity defaults to should_review=true.
          full_files="$(gh pr diff "$PR" -R "$REPO" --name-only 2>/dev/null || echo "__ERROR__")"
          if [ "$full_files" = "__ERROR__" ]; then
            review "gh pr diff --name-only failed — running review."
            exit 0
          fi
          if [ -z "$full_files" ]; then
            review "PR diff reports no changed files — running review."
            exit 0
          fi

          # Fail-safe, like every other gate in this step: if the filter itself
          # fails, review rather than silently treating the PR as unreviewable
          # (an empty list here would otherwise read as "docs-only" and skip).
          non_ignored_files="$(printf '%s\n' "$full_files" \
            | node "$GITHUB_WORKSPACE/bin/pr-diff-filter.mjs" reviewable \
            || echo "__ERROR__")"
          if [ "$non_ignored_files" = "__ERROR__" ]; then
            review "pr-diff-filter failed — running review."
            exit 0
          fi
          non_ignored_count="$(printf '%s' "$non_ignored_files" | grep -c . || true)"

          # Whether this PR's reviewable changes include the review-gate
          # workflow itself, and what else (if anything) changed alongside
          # it. GitHub refuses to mint the OIDC token claude-code-action
          # needs whenever the running workflow file differs from main's
          # copy, so the action always self-skips on such a PR — a live
          # review can never happen here regardless of should_review, for
          # ANY reviewable file in the PR, not just the workflow diff.
          # Recorded now so the fallback step after the action can tell
          # "structurally impossible" (safe to auto-pass) apart from
          # "Claude ran and forgot to write a verdict" (a real bug that
          # must keep failing) — and so it can say explicitly which other
          # files, if any, went unreviewed as a result. Logic lives in
          # bin/lib/pr-review-gate.mjs, unit-tested in
          # bin/tests/pr-review-gate.test.ts.
          workflow_gate_status="$(printf '%s\n' "$non_ignored_files" \
            | node "$GITHUB_WORKSPACE/bin/pr-review-gate.mjs" workflow-gate-status \
            || echo "__ERROR__")"
          if [ "$workflow_gate_status" = "__ERROR__" ]; then
            # Fail-safe default: false — matches the pre-existing default
            # this replaces. A crash here must never silently widen the
            # auto-pass path below.
            workflow_gate_changed=false
            other_reviewable_files=""
          else
            workflow_gate_changed="$(printf '%s\n' "$workflow_gate_status" | sed -n '1p')"
            other_reviewable_files="$(printf '%s\n' "$workflow_gate_status" | sed -n '2p')"
          fi
          echo "workflow_gate_changed=$workflow_gate_changed" >> "$GITHUB_OUTPUT"
          echo "other_reviewable_files=$other_reviewable_files" >> "$GITHUB_OUTPUT"

          if [ "$non_ignored_count" -eq 0 ]; then
            echo "should_review=false" >> "$GITHUB_OUTPUT"
            echo "Entire PR diff is docs/config-only — skipping review."
            exit 0
          fi

          # --slurp so the filter runs once over all pages (a bare
          # --paginate --jq applies `last` per page and can concatenate bodies).
          #
          # The filter is PIPED to jq rather than passed as --jq: gh rejects
          # `--slurp` combined with `--jq` outright ("the --slurp option is not
          # supported with --jq or --template", gh 2.97.0). Until 2026-08-20
          # this was written as `--slurp --jq ...`, so the command always
          # failed, `2>/dev/null || true` swallowed the error, and `body` was
          # unconditionally empty — meaning this step always fell through to
          # "No prior claude[bot] comment" and the prior-PASS skip below never
          # once fired. It failed safe (over-reviewing, never under-reviewing),
          # which is why it went unnoticed. gh and jq failures are now logged
          # distinguishably from "no comment exists" so a structurally
          # identical regression can't hide silently again.
          body=""
          comments_json="$GITHUB_WORKSPACE/.claude-guard-comments.json"
          fetch_err="$GITHUB_WORKSPACE/.claude-guard-comments.err"
          if ! gh api "repos/$REPO/issues/$PR/comments" --paginate --slurp \
            > "$comments_json" 2>"$fetch_err"; then
            review "gh api failed fetching the comment thread: $(cat "$fetch_err" 2>/dev/null) — running review."
            exit 0
          fi
          if ! body="$(jq -r 'add | [.[] | select(.user.login == "claude[bot]")] | last // {} | .body // ""' \
            "$comments_json" 2>"$fetch_err")"; then
            review "jq failed parsing the comment thread: $(cat "$fetch_err" 2>/dev/null) — running review."
            exit 0
          fi

          if [ -z "$body" ]; then
            review "No prior claude[bot] comment — running review."
            exit 0
          fi

          # Round bound: how many of this PR's claude[bot] comments actually
          # parse as a review verdict. Computed here (rather than folded into
          # the jq expression above) so the existing, already-tested `body`
          # extraction is untouched — this reads the same already-fetched
          # comments_json a second time. Scoped to comments that parse a
          # `### Verdict` line (bin/lib/pr-review-gate.mjs's
          # countReviewComments(), via the count-review-comments CLI mode) —
          # a bare `.user.login == "claude[bot]"` filter would also count
          # claude-assistant.yml's replies to an `@claude` mention, which
          # that workflow accepts from ANY commenter with no actor allowlist
          # and posts under the same claude[bot] identity on the same PR
          # thread. At least one claude[bot] comment exists by this point
          # (the `-z "$body"` check above already returned), so every branch
          # below this line is a re-review of some kind — round 1 (no prior
          # comment) can never hit the limit.
          count_fetch_err="$GITHUB_WORKSPACE/.claude-guard-count.err"
          if ! claude_bodies="$(jq -c \
            'add | [.[] | select(.user.login == "claude[bot]") | .body // ""]' \
            "$comments_json" 2>"$count_fetch_err")"; then
            echo "jq failed collecting claude[bot] comment bodies for the round count: $(cat "$count_fetch_err" 2>/dev/null) — defaulting round count to 0."
            claude_bodies="[]"
          fi
          claude_comment_count="$(printf '%s' "$claude_bodies" \
            | node "$GITHUB_WORKSPACE/bin/pr-review-gate.mjs" count-review-comments \
            || echo 0)"

          # A non-converging loop stops spending turns/tokens on repetition
          # once it has already run MAX_REVIEW_ROUNDS times and hands off to
          # a human instead of running a 4th+ review — see MAX_REVIEW_ROUNDS'
          # job-env comment and docs/contributing/branch-protection.md's
          # override procedure. should_review stays false, but this is NOT
          # the same as the two pre-existing should_review=false cases above
          # (docs-only PR, prior-PASS-with-only-ignored-changes) — those are
          # genuinely safe to carry forward as PASS; this one is not (the
          # last real verdict could be FAIL), so it's tracked with its own
          # output and a dedicated step writes FAIL, not the
          # "Carry prior PASS verdict" step below.
          escalate_round_limit() {
            echo "should_review=false" >> "$GITHUB_OUTPUT"
            echo "round_limit_reached=true" >> "$GITHUB_OUTPUT"
            echo "review_round_count=$claude_comment_count" >> "$GITHUB_OUTPUT"
            echo "Round limit reached ($claude_comment_count/$MAX_REVIEW_ROUNDS review round(s) already posted) — escalating instead of a review triggered by: $1."
          }

          # Applies the round bound uniformly to every branch below that
          # would otherwise trigger a re-review — including the fail-safe
          # branches (compare API failure, missing SHA marker, filter
          # failure) that used to run unconditionally, which would have let
          # a persistently-failing compare call loop past the round bound
          # forever. $1 is a short reason fragment; both messages are built
          # from it, so the final log line reads identically to before this
          # helper existed.
          review_or_escalate() {
            if [ "$claude_comment_count" -ge "$MAX_REVIEW_ROUNDS" ]; then
              escalate_round_limit "$1"
            else
              review "$1 — running review."
            fi
          }

          # Parsing logic lives in bin/lib/pr-review-gate.mjs, unit-tested in
          # bin/tests/pr-review-gate.test.ts — replaces a bare word-search
          # (`grep -qiw 'PASS'` over the 2 lines after the heading) that read
          # a FAIL whose one-line reason happened to contain the word "pass"
          # as a PASS.
          prior_verdict="$(printf '%s' "$body" \
            | node "$GITHUB_WORKSPACE/bin/pr-review-gate.mjs" parse-verdict \
            || echo "__ERROR__")"
          if [ "$prior_verdict" != "PASS" ]; then
            review_or_escalate "Prior verdict was not PASS (${prior_verdict})"
            exit 0
          fi

          reviewed_sha="$(printf '%s' "$body" \
            | node "$GITHUB_WORKSPACE/bin/pr-review-gate.mjs" parse-sha \
            || echo "")"
          if [ -z "$reviewed_sha" ]; then
            review_or_escalate "Prior comment has no reviewed-sha marker"
            exit 0
          fi

          files="$(gh api "repos/$REPO/compare/$reviewed_sha...$HEAD_SHA" \
            --jq '.files[].filename' 2>/dev/null || echo "__ERROR__")"
          if [ "$files" = "__ERROR__" ]; then
            review_or_escalate "Compare API failed"
            exit 0
          fi
          if [ -z "$files" ]; then
            review_or_escalate "No compare data"
            exit 0
          fi

          changed_reviewable="$(printf '%s\n' "$files" \
            | node "$GITHUB_WORKSPACE/bin/pr-diff-filter.mjs" reviewable \
            || echo "__ERROR__")"
          if [ "$changed_reviewable" = "__ERROR__" ]; then
            review_or_escalate "pr-diff-filter failed"
            exit 0
          fi
          first_reviewable="$(printf '%s' "$changed_reviewable" | head -n1)"
          if [ -n "$first_reviewable" ]; then
            if [ "$claude_comment_count" -ge "$MAX_REVIEW_ROUNDS" ]; then
              escalate_round_limit "a reviewable change since PASS ($first_reviewable)"
              exit 0
            fi
            # Delta review: this branch is the only place a prior PASS's
            # commit SHA is both known and still meaningful as a diff base
            # (a FAIL re-review above has no such baseline — the whole PR
            # still needs re-checking against the prompt's Re-review
            # convergence rules). reviewed_sha becomes the precompute step's
            # compare-API base; the prior round's Must-fix list (parsed from
            # $body, empty on a clean PASS) is written to a file the prompt
            # tells the reviewer to check — see "Pre-compute PR diff for
            # review" below and REVIEW.md's Re-review convergence section.
            # (This file's mere existence is a trust signal read by the
            # prompt — safe only because the "Clear any committed workflow
            # artifacts" step already removed any same-named file the PR
            # branch itself might have carried into the checkout.)
            echo "reviewed_sha=$reviewed_sha" >> "$GITHUB_OUTPUT"
            node "$GITHUB_WORKSPACE/bin/pr-review-gate.mjs" parse-must-fix \
              <<< "$body" > "$GITHUB_WORKSPACE/.claude-prior-mustfix.md" || true
            review "Reviewable file changed since PASS ($first_reviewable) — running review."
            exit 0
          fi

          echo "should_review=false" >> "$GITHUB_OUTPUT"
          echo "Prior verdict PASS and only ignored files changed since $reviewed_sha — skipping review."

      # Pre-compute the diff once and hand it to Claude so the reviewer reads a
      # single patch file instead of burning turns rediscovering the diff via
      # `gh pr diff` / `git diff` (the main turn-count driver). `gh pr diff` is
      # API-based, so it works on the `fetch-depth: 1` shallow checkout without
      # deepening the clone. Non-fatal: on any gh failure the files are removed
      # and the review prompt falls back to fetching the diff itself.
      - name: Pre-compute PR diff for review
        id: precompute
        if: steps.guard.outputs.should_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ steps.guard.outputs.reviewed_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Delta path: REVIEWED_SHA is only set by the guard step's
          # "reviewable file changed since PASS" branch — a scoped compare
          # against the commit that earned the prior PASS, instead of the
          # full PR diff. bin/pr-review-gate.mjs build-delta-patch
          # reconstructs a synthetic unified diff from the compare API's
          # per-file `patch` fields, in the exact `diff --git a/x b/x` /
          # `--- a/x` / `+++ b/x` shape bin/lib/pr-diff-filter.mjs's
          # patch-splitting already expects — so the SAME filtering and
          # size-measurement logic below applies unmodified to either path.
          # Entirely non-fatal: any failure here (API error, empty response,
          # malformed JSON) falls through to the full-diff path below rather
          # than aborting — a delta review is an optimization, never a
          # requirement.
          is_delta=false
          if [ -n "$REVIEWED_SHA" ]; then
            compare_err="$GITHUB_WORKSPACE/.claude-compare.err"
            compare_json="$(gh api "repos/$REPO/compare/$REVIEWED_SHA...$HEAD_SHA" 2>"$compare_err" || echo "")"
            # Every condition below must hold for a delta to be trustworthy:
            # a non-empty API response, build-delta-patch succeeding (it
            # itself returns non-zero — see bin/lib/pr-review-gate.mjs's
            # buildDeltaPatch() — when the file list hits GitHub's 300-file
            # compare-API cap, or any file has a real content change with no
            # `patch` field GitHub could have withheld for size/binary
            # reasons it cannot safely guess between), AND both output files
            # existing and non-empty. That last check matters on its own:
            # the guard step already proved a reviewable file changed since
            # REVIEWED_SHA, so an empty result here — both commands
            # succeeding, zero files reported — means the two independent
            # compare-API calls (guard's and this one) disagree, not that
            # there is genuinely nothing to review. Treat that as a build
            # failure, not a smaller-than-expected success.
            if [ -n "$compare_json" ] \
              && printf '%s' "$compare_json" \
                | node "$GITHUB_WORKSPACE/bin/pr-review-gate.mjs" build-delta-patch \
                  > "$GITHUB_WORKSPACE/.claude-pr-diff.patch" 2>/dev/null \
              && printf '%s' "$compare_json" \
                | jq -r '.files[].filename' \
                  > "$GITHUB_WORKSPACE/.claude-pr-changed-files.txt" 2>/dev/null \
              && [ -s "$GITHUB_WORKSPACE/.claude-pr-diff.patch" ] \
              && [ -s "$GITHUB_WORKSPACE/.claude-pr-changed-files.txt" ]; then
              is_delta=true
              echo "Delta review: comparing ${REVIEWED_SHA}...${HEAD_SHA} (since the prior PASS) instead of the full diff."
            else
              echo "Delta patch build failed or was untrustworthy — falling back to the full diff. Compare API stderr (if any): $(cat "$compare_err" 2>/dev/null)" >&2
              rm -f "$GITHUB_WORKSPACE/.claude-pr-diff.patch" "$GITHUB_WORKSPACE/.claude-pr-changed-files.txt"
            fi
          fi
          echo "is_delta=$is_delta" >> "$GITHUB_OUTPUT"

          if [ "$is_delta" != true ]; then
            # The guard step may have already written .claude-prior-mustfix.md
            # expecting a delta to follow. The prompt's "What to review"
            # section treats that file's mere existence as the signal that
            # this is a delta re-review whose rest "already passed and does
            # not need re-reading" — if the delta build just failed above,
            # that signal would be actively wrong for the full diff about to
            # be fetched below, so it must not survive into a non-delta run.
            rm -f "$GITHUB_WORKSPACE/.claude-prior-mustfix.md"
            # NO --patch. `gh pr diff --patch` returns the per-commit patch
            # SERIES, not a unified diff: on PR #523 it emitted 104
            # `diff --git` headers for 44 unique files, with
            # `M3LProcedure.ts` appearing 8 times and 309,876 reviewable
            # chars of pure duplication (696,940 with --patch vs 501,454
            # without). Two consequences, both bad: the reviewer paged
            # through the same file once per commit that touched it — a large
            # hidden turn sink, and it saw superseded intermediate states of
            # code that a later commit had already fixed — and the size gate
            # over-measured every multi-commit PR in proportion to its commit
            # count, rejecting at an effective threshold ~28-39% stricter
            # than MAX_REVIEWABLE_BYTES intends (that limit was calibrated on
            # squashed single-commit diffs, which are never inflated).
            # The default output is the same unified-diff format, so the
            # filter below and the review prompt are unaffected.
            gh pr diff "$PR" -R "$REPO" \
              > "$GITHUB_WORKSPACE/.claude-pr-diff.patch" \
              || rm -f "$GITHUB_WORKSPACE/.claude-pr-diff.patch"
            gh pr diff "$PR" -R "$REPO" --name-only \
              > "$GITHUB_WORKSPACE/.claude-pr-changed-files.txt" \
              || rm -f "$GITHUB_WORKSPACE/.claude-pr-changed-files.txt"
          fi

          # Strip from the patch every file the reviewer is not meant to read,
          # then filter the changed-file list the same way. Both use the single
          # ignore set in bin/lib/pr-diff-filter.mjs, reached through
          # `bin/pr-diff-filter.mjs`; the guard step above uses the same one.
          #
          # Why the filtering exists at all: until 2026-08-20 the patch was
          # handed over unfiltered, so the reviewer was given megabytes of docs
          # it was explicitly told to ignore. Across the 14 PRs merged before
          # that change, reviewable content was 0-84% of the patch (`305ed34`:
          # 575,724 chars total, 74,676 reviewable — 87% waste). This repo's
          # markdown makes it worse than it sounds, since lines run up to 6,315
          # chars, so a 5-line edit to `docs/implementation-status.md`
          # contributed 61KB of patch. Filtering the file list matters for the
          # same reason: an unfiltered list invites the reviewer to `Read` the
          # very files the patch just told it to ignore, which costs turns for
          # nothing.
          #
          # Each omitted file keeps its `diff --git` header plus a one-line
          # marker, so the reviewer can still see that the file changed and
          # never mistakes an omission for an unchanged file. Non-fatal on
          # purpose: on any failure the original file is left as-is rather
          # than aborting the job.
          patch="$GITHUB_WORKSPACE/.claude-pr-diff.patch"
          if [ -f "$patch" ]; then
            node "$GITHUB_WORKSPACE/bin/pr-diff-filter.mjs" patch "$patch" || true
          fi

          files="$GITHUB_WORKSPACE/.claude-pr-changed-files.txt"
          if [ -f "$files" ]; then
            node "$GITHUB_WORKSPACE/bin/pr-diff-filter.mjs" changed-files "$files" || true
          fi

          # Measure what is actually left to review and decide whether a
          # faithful single-pass review is possible at all. Fail-safe: if the
          # patch is missing (gh failed above), leave too_large=false so the
          # review still runs and falls back to fetching the diff itself —
          # exactly the pre-existing behaviour.
          reviewable_bytes=0
          if [ -f "$patch" ]; then
            reviewable_bytes="$(wc -c < "$patch" | tr -d ' ')"
          fi
          echo "reviewable_bytes=$reviewable_bytes" >> "$GITHUB_OUTPUT"
          echo "Reviewable patch: ${reviewable_bytes} chars (limit ${MAX_REVIEWABLE_BYTES})."

          too_large=false
          if [ "$reviewable_bytes" -gt "$MAX_REVIEWABLE_BYTES" ]; then
            too_large=true
          fi
          echo "too_large=$too_large" >> "$GITHUB_OUTPUT"

      # An oversized PR gets a deterministic, actionable FAIL instead of a
      # review that burns the whole turn budget and dies on max turns with
      # nothing posted (PR #523: three runs, ~$8.15, no verdict). Claude never
      # starts, so this costs $0. See docs/contributing/branch-protection.md.
      - name: Reject an unreviewably large PR
        if: steps.precompute.outputs.too_large == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEWABLE_BYTES: ${{ steps.precompute.outputs.reviewable_bytes }}
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/.claude-pr-diff.patch"

          # Name the worst offenders so the author knows where to cut, rather
          # than just being told "too big".
          top="$(awk '
            /^diff --git / { f = $3; sub(/^a\//, "", f) }
            { b[f] += length($0) + 1 }
            END { for (k in b) printf "%d\t%s\n", b[k], k }
          ' "$patch" 2>/dev/null | sort -rn | head -n 5 \
            | awk -F'\t' '{ printf "- `%s` — %d chars\n", $2, $1 }' || true)"

          {
            echo "## Claude PR Review — not run"
            echo ""
            echo "This PR's **reviewable** diff is ${REVIEWABLE_BYTES} characters,"
            echo "over the ${MAX_REVIEWABLE_BYTES}-character limit for a single-pass"
            echo "blocking review (docs and \`pnpm-lock.yaml\` are already excluded"
            echo "from that figure). A review this size cannot be faithful, so the"
            echo "gate fails fast instead of spending a full turn budget and"
            echo "reporting nothing."
            echo ""
            echo "**Largest contributors:**"
            echo ""
            echo "${top:-- (could not compute)}"
            echo ""
            echo "Split this into smaller PRs and each one will review normally."
            echo "See \`docs/contributing/branch-protection.md\` for the rationale"
            echo "and the current limit."
          } > "$GITHUB_WORKSPACE/.claude-oversize-comment.md"

          # Posted with github.token, so this lands as github-actions[bot], not
          # claude[bot] — the guard step's `.user.login == "claude[bot]"` filter
          # and the verdict fallback below can never mistake it for a review.
          gh pr comment "$PR" -R "$REPO" \
            --body-file "$GITHUB_WORKSPACE/.claude-oversize-comment.md" || true

          printf 'FAIL' > "$GITHUB_WORKSPACE/.claude-review-verdict"
          echo "::error title=Claude PR Review::Reviewable diff is ${REVIEWABLE_BYTES} chars, over the ${MAX_REVIEWABLE_BYTES} limit — split this PR."

      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        id: claude-review
        if: steps.guard.outputs.should_review == 'true' && steps.precompute.outputs.too_large != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --safe-mode drops CLAUDE.md, skills, plugins, hooks, MCP servers and
          # custom agents from this job — none of it helps a diff-only review,
          # and one hook (inject-decision-gate.mjs) actively injects a
          # /start-work reminder into a prompt that must never branch.
          # --effort medium is Anthropic's documented cost-saving step-down
          # from Opus 5's default `high`; Code Review docs describe lower
          # effort as reporting only the highest-confidence findings, which
          # suits a merge-blocking gate. --exclude-dynamic-system-prompt-
          # sections moves per-machine context (cwd/platform/shell/OS) out of
          # the system prompt so a fresh runner's prefix can still hit a warm
          # cache from an earlier run on the same PR within the 1h TTL.
          # --max-turns comes from MAX_TURNS at the job level (single source of
          # truth, shared with the metrics step).
          #
          # Model and effort stay fixed across every round, including a delta
          # re-review — no further step-down to e.g. --effort low. Anthropic's
          # effort-as-precision-dial framing (Code Review docs) is about
          # first-pass coverage tuning, not specifically re-review cost, and
          # no official source endorses switching effort per round (see
          # docs/research/pr-review-action-tuning.md). The delta patch itself
          # is what buys the savings on a re-review (fewer tokens read from a
          # smaller diff, PR 4 of the loop-economics revision) — not a
          # lower-precision reviewer confirming a fix, which risks confirming
          # it wrongly on exactly the round that most needs to be right.
          #
          # --allowedTools stays scoped (no curl/wget/arbitrary exec against
          # untrusted diff content). A redirect target (`> path`) is checked
          # separately from the command, as a file write against Edit(path)
          # allow rules: a Bash command-prefix rule like Bash(echo:*)
          # authorizes the command, never the redirect target, and Write(path)
          # rules are accepted but silently never consulted for this check.
          # That is why every writable path here needs its own Edit(...) grant,
          # written as the exact literal string the command uses — the matcher
          # does not expand shell variables, which is why PR #503's
          # Edit(./.claude-review-verdict) grant did nothing until #504 changed
          # the command from "$GITHUB_WORKSPACE/.claude-review-verdict" to the
          # plain relative ./.claude-review-verdict.
          #
          # The two grants below were derived by probing Claude Code 2.1.237
          # directly (2026-08-20) rather than inferred, after #503 and #504
          # both shipped on inference and left 7-15 denials per run:
          #
          #   * Edit(./.claude-review-comment.md) — the review comment is
          #     multi-line markdown, so the natural way to post it is
          #     `gh pr comment --body-file`, which needs the body written to
          #     disk first. With no writable path for it, a *two-line* heredoc
          #     cost 3 denials over 4 turns in the probe; a full review comment
          #     costs more. This was the single largest remaining denial source.
          #   * Bash(gh pr diff:*) — the prompt's own fallback (further down)
          #     tells the model to run `gh pr diff` when the patch file is
          #     missing, but only Bash(gh pr comment:*) was granted, so that
          #     instruction was guaranteed to be denied. Read-only API call.
          #
          # Deliberately NOT added, because the same probes showed they are
          # already permitted and would be pure noise: Bash(head:*)/Bash(tail:*)
          # and other read-only builtins are auto-approved even when unlisted
          # (and stay approved inside a pipe), and the read-only native tools
          # Grep/Glob/TodoWrite need no grant. Also deliberately absent:
          # sed/awk/tee, all of which can write in place.
          #
          # --safe-mode still removes guard-readonly-bash.mjs; the scoped Bash
          # list plus these Edit grants are the write barrier, not a blanket
          # allowance. See docs/research/pr-review-action-tuning.md for the
          # full probe table.
          claude_args: >-
            --safe-mode
            --model claude-opus-5
            --effort medium
            --exclude-dynamic-system-prompt-sections
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "Read,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(cat:*),Bash(echo:*),Bash(grep:*),Bash(rg:*),Bash(wc:*),Edit(./.claude-review-verdict),Edit(./.claude-review-comment.md)"
          use_sticky_comment: true
          prompt: |
            You are the blocking PR reviewer for this repo. Review ONLY what is visible in
            the diff; do not speculate about code outside it. Do not modify any files.

            `ci.yml` already gates ESLint, Prettier, typecheck, coverage thresholds, exports
            snapshot drift, secret scanning, and commit-message linting as required checks —
            do not re-derive or re-verify any of those; a violation there fails the merge
            independently of this review. Focus entirely on what those checks cannot catch:
            semantic correctness and this repo's specific conventions below.

            ## Severity tiers

            Restated from this repo's REVIEW.md — the canonical source `pnpm check:review-policy`
            keeps this file in sync with.

            - **Must-fix** — breaks correctness, violates a stated project rule (this
              repo's `docs/contributing/style-guide.md` and `.claude/rules/*.md`), or
              introduces a security/silent-failure defect. Blocks merge.
            - **Should-fix** — a real quality issue that does not block merge on its
              own: a missed edge case, a weak type, a maintainability concern.
            - **Nit** — style, naming, or preference. Never blocks merge.

            Reserve Must-fix for what actually blocks; route preference/stylistic items
            to Nits explicitly rather than inflating Should-fix. If a change is sound,
            say so plainly and leave the Must-fix list empty rather than padding it.

            ## Error handling

            - Only throw instances of `M3LError` subclasses, never bare strings
            - Chain underlying failures with the `cause` option
            - No silently swallowed errors (empty catch, optional-chaining a fallible call
              away, a retry/poll loop that exhausts without surfacing failure)

            ## Exports map and privacy

            - A diff touching `src/core/index.ts`, `src/aws/index.ts`, or the `exports`
              field in `package.json` that changes the public surface must be reflected in
              the PR title (`feat!:` or `BREAKING CHANGE:` footer) — `pnpm check:api`
              already enforces the snapshot itself; you are checking the semver framing
              matches the diff, not re-running the tool
            - Nothing under `internal/` may be re-exported through `src/core/index.ts` or
              `src/aws/index.ts`

            ## Public API surface

            - An `eslint-disable` comment suppressing `@typescript-eslint/no-explicit-any`
              or `@typescript-eslint/no-non-null-assertion` anywhere the diff touches
              `src/core/**`, `src/aws/**`, or a package barrel is a Must-fix — ESLint blocks
              bare `any`/`!` as errors, so the only way either reaches the public API is a
              disable comment, which the linter cannot itself flag as wrong

            ## Security

            - Validate all external input at the public API boundary (not a pattern
              gitleaks/CodeQL check for — those catch known vulnerability signatures and
              literal secrets, not missing validation)

            ## Testing

            - Every new exported function must have at least one happy-path test and one
              failure-path test — `pnpm test:coverage`'s aggregate threshold can pass while
              a specific new export has none
            - No network calls or filesystem access in unit tests (mock collaborators)

            ## Verification bar

            A behavior claim needs a `file:line` citation in the source. Do not report
            anything inferred from a name, or anything you could not confirm by reading the
            diff or the cited file.

            ## Re-review convergence

            On a re-review (prior Claude comments already exist on this PR):
            - Re-check all Must-fix items from prior rounds and newly changed lines.
            - Post Must-fix findings only. Suppress new Should-fix/Nit findings entirely —
              report them as a single count in the summary line, not as bullets.
            - If all prior Must-fix items are resolved and no new Must-fix items exist, the
              verdict is PASS even if unaddressed nits remain.
            - On a delta re-review (see "What to review" below — the patch you're given
              covers only what changed since a prior PASS, not the whole PR), read
              `./.claude-prior-mustfix.md` if it exists for the prior round's outstanding
              Must-fix items (empty when the prior verdict was a clean PASS) and confirm
              each is still resolved in the delta before writing a new verdict — you do
              not need to re-derive already-passed content outside the delta.

            ## Output format

            Post a single PR comment in exactly this structure (blank line before and after
            every heading and every list; no trailing whitespace; no hard tabs; `-` bullets;
            cite locations as `path/to/file.ts:line`; be concise — do not restate unchanged
            conventions):

            Cap each section at its 10 most severe findings, most-severe first (this
            number, the severity tiers, and the exclusions below are restated from this
            repo's REVIEW.md — the canonical source `pnpm check:review-policy` keeps this
            file in sync with; --safe-mode means this job cannot read it live, so this
            prompt carries its own copy). If a class of issue recurs, collapse it into
            ONE bullet listing every instance (per the exhaustive-sweep rule) rather than
            spilling past the cap. A small comment also keeps later re-reviews cheap.

            ```
            ## Claude PR Review — `<pr title>`

            <1–2 sentence summary of the change and overall assessment.>

            ### Must-fix

            - **`path/to/file.ts:line`** — <violation> (<which rule>).

            _None._ (if no must-fix findings)

            ### Should-fix

            - …

            _None._ (if no should-fix findings)

            ### Nits

            - …

            _None._ (if no nit findings)

            ### Verdict

            - PASS|FAIL — <one-line reason>

            <!-- claude-review-sha: ${{ github.event.pull_request.head.sha }} -->
            ```

            The trailing `claude-review-sha` HTML comment is REQUIRED and must be
            the last line of the comment, copied verbatim (the SHA is already
            substituted). It lets a later run detect what commit this verdict
            reviewed and skip a redundant re-review.

            ## Turn budget (bounded review)

            The diff is already provided as a patch file — a typical review needs only a
            handful of reads and converges well under the turn limit. If you find yourself
            approaching it anyway, STOP exploring and immediately (a) post the review
            comment with the findings you have and (b) write the verdict file. NEVER
            consume the whole budget without posting a comment and writing
            `.claude-review-verdict`: a bounded, slightly-incomplete review that
            posts a verdict is far better than an exhausted run that posts nothing.

            Every tool call you are permitted to make is listed below. Anything else is
            denied, and a denied call costs you a turn and gets you no closer — so do not
            reach for `sed`, `awk`, `split`, `tee`, the `Write` tool, or any `gh` subcommand
            other than `gh pr comment` / `gh pr diff`.

            - `Read` — the patch, and source files when a hunk lacks context
            - `Grep`, `Glob` — searching the checkout
            - `Bash`: `cat`, `echo`, `grep`, `rg`, `wc` (and read-only builtins like
              `head` / `tail`)
            - `Bash`: `gh pr comment` to post, `gh pr diff` only as the fallback below
            - writes: ONLY `./.claude-review-comment.md` and `./.claude-review-verdict`

            To post the comment, write the body to `./.claude-review-comment.md` (a
            heredoc is fine — it is the one scratch path you may write) and post it with
            `gh pr comment <n> -R <repo> --body-file ./.claude-review-comment.md`. Use
            those exact relative paths: the permission matcher compares the literal string
            in your command and does not expand shell variables, so a
            `$GITHUB_WORKSPACE`-prefixed path will be denied.

            ## Verdict (REQUIRED — this gate is blocking)

            After posting the comment, your FINAL action MUST be to run exactly
            one of these two Bash commands (choose based on your verdict), with
            the SHA below substituted verbatim — it stamps the verdict to the
            commit under test, so a stale verdict file left over by an earlier
            run can never be mistaken for a fresh one:

              echo -n 'PASS ${{ github.event.pull_request.head.sha }}' > ./.claude-review-verdict
              echo -n 'FAIL ${{ github.event.pull_request.head.sha }}' > ./.claude-review-verdict

            Use the Bash tool — do NOT use the Write tool for this step.
            Use this exact relative path, not an absolute path or
            `$GITHUB_WORKSPACE`-prefixed path — your working directory is
            already the checked-out repo root.
            The job fails the merge gate unless the file starts with `PASS `.

            ## What to review

            The diff for this review is at `$GITHUB_WORKSPACE/.claude-pr-diff.patch`
            and the changed-file list at `$GITHUB_WORKSPACE/.claude-pr-changed-files.txt`.
            **Read the patch file first** and review only those hunks. Open a full
            source file with `Read` ONLY when a hunk lacks the surrounding context you
            need — do NOT run `gh pr diff` or `git diff` to rediscover the diff; it is
            already provided. If the patch is very large, read it in chunks with `Read`
            offset/limit. Fallback: only if the patch file is missing (the pre-compute
            step failed), fetch it yourself with
            `gh pr diff ${{ github.event.pull_request.number }} -R ${{ github.repository }}`.

            **If `./.claude-prior-mustfix.md` exists in the workspace, this is a delta
            re-review**: the patch above covers only files changed since a prior PASS,
            not the whole PR — everything else in the PR already passed and does not
            need re-reading. See the Re-review convergence section above for how to use
            that file.

            Both files are already filtered to what this gate reviews: docs (`*.md`,
            `docs/**`), `.github/dependabot.yml` and `pnpm-lock.yaml` have had their
            hunks replaced by a one-line `(diff omitted — …)` marker under their
            `diff --git` header. Those markers tell you the file changed; do NOT review
            them, do NOT `Read` the underlying files, and do NOT report their absence as
            a finding.

            Now review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}. Post a single PR comment in the Output format above, then write the verdict file as instructed.

      # Observability only: never affects the PASS/FAIL verdict or the
      # blocking gate below. Reads the execution log the action already
      # produces (steps.claude-review.outputs.execution_file) and pulls
      # metrics from its final `result` entry. Defensive throughout — a
      # missing/malformed file must never fail this job.
      - name: Log Claude review metrics
        if: always() && steps.guard.outputs.should_review == 'true'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          IS_DELTA: ${{ steps.precompute.outputs.is_delta }}
        run: |
          set +e

          review_mode="full diff"
          if [ "$IS_DELTA" = "true" ]; then
            review_mode="delta (since prior PASS)"
          fi

          changed_files="n/a"
          patch_lines="n/a"
          patch_chars="0"
          if [ -f "$GITHUB_WORKSPACE/.claude-pr-changed-files.txt" ]; then
            changed_files="$(wc -l < "$GITHUB_WORKSPACE/.claude-pr-changed-files.txt" | tr -d ' ')"
          fi
          if [ -f "$GITHUB_WORKSPACE/.claude-pr-diff.patch" ]; then
            patch_lines="$(wc -l < "$GITHUB_WORKSPACE/.claude-pr-diff.patch" | tr -d ' ')"
            patch_chars="$(wc -c < "$GITHUB_WORKSPACE/.claude-pr-diff.patch" | tr -d ' ')"
          fi

          # Early warning that a PR is drifting toward MAX_REVIEWABLE_BYTES,
          # where the gate stops reviewing and starts rejecting. 120k is also
          # roughly where claude-code-action is reported to truncate an
          # injected diff — but that figure appears in no official doc, and it
          # is unclear whether it even applies here, since the reviewer opens
          # the patch itself with `Read` rather than receiving it inline. Treat
          # this as a size signal, not a confirmed truncation.
          if echo "$patch_chars" | grep -qE '^[0-9]+$' && [ "$patch_chars" -ge 120000 ]; then
            echo "::warning title=Claude PR Review::Reviewable patch is ${patch_chars} characters (limit ${MAX_REVIEWABLE_BYTES}) — large enough that the review may be shallow; consider splitting the PR"
            echo "**⚠️ Large reviewable diff** — ${patch_chars} characters against a ${MAX_REVIEWABLE_BYTES} limit." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -z "$EXECUTION_FILE" ] || [ ! -s "$EXECUTION_FILE" ]; then
            echo "Claude PR review: no execution file available — skipping metrics." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          result="$(jq -c '[.[] | select(.type == "result")] | last // empty' "$EXECUTION_FILE" 2>/dev/null)"
          if [ -z "$result" ]; then
            echo "Claude PR review: execution file had no result entry — skipping metrics." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          num_turns="$(echo "$result" | jq -r '.num_turns // "n/a"')"
          duration_ms="$(echo "$result" | jq -r '.duration_ms // "n/a"')"
          duration_api_ms="$(echo "$result" | jq -r '.duration_api_ms // "n/a"')"
          cost_usd="$(echo "$result" | jq -r '.total_cost_usd // "n/a"')"
          is_error="$(echo "$result" | jq -r '.is_error // "n/a"')"
          subtype="$(echo "$result" | jq -r '.subtype // "n/a"')"
          input_tokens="$(echo "$result" | jq -r '.usage.input_tokens // "n/a"')"
          output_tokens="$(echo "$result" | jq -r '.usage.output_tokens // "n/a"')"
          cache_read="$(echo "$result" | jq -r '.usage.cache_read_input_tokens // "n/a"')"
          cache_write="$(echo "$result" | jq -r '.usage.cache_creation_input_tokens // "n/a"')"

          # WHICH tools were denied, not just how many. Denials ran 7-15 per
          # run for weeks (~30% of the budget) and were undiagnosable, because
          # the action hides the SDK transcript and this step only ever read a
          # count — so PRs #503 and #504 were both aimed at a guess. The result
          # entry carries a structured `permission_denials` array (confirmed by
          # probing Claude Code 2.1.237 directly); tool names only, inputs
          # truncated hard, since the inputs quote untrusted diff content.
          # Falls back to a count, then to the result entry's key names, so a
          # future SDK schema change surfaces as "look here" instead of silence.
          denied="$(echo "$result" \
            | jq -r '[.permission_denials[]?.tool_name] | group_by(.)
                     | map("\(.[0]) x\(length)") | join(", ")' 2>/dev/null)"
          if [ -z "$denied" ] || [ "$denied" = "null" ]; then
            denial_count="$(echo "$result" | jq -r '.permission_denials_count // "n/a"' 2>/dev/null)"
            if [ "$denial_count" != "n/a" ] && [ "$denial_count" != "null" ]; then
              denied="none reported (count=${denial_count}; no per-tool detail in this SDK version)"
            else
              denied="unavailable — result keys: $(echo "$result" | jq -r 'keys | join(",")' 2>/dev/null | head -c 300)"
            fi
          fi
          denied_detail="$(echo "$result" \
            | jq -r '.permission_denials[]? | "- `\(.tool_name)` — \((.tool_input | tostring)[0:160])"' \
              2>/dev/null | head -n 12)"

          {
            echo "### Claude PR Review metrics"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Turns | ${num_turns} / ${MAX_TURNS} |"
            echo "| Duration (wall / API) | ${duration_ms}ms / ${duration_api_ms}ms |"
            echo "| Cost | \$${cost_usd} |"
            echo "| Tokens (in / out) | ${input_tokens} / ${output_tokens} |"
            echo "| Cache (read / write) | ${cache_read} / ${cache_write} |"
            echo "| Result | subtype=${subtype}, is_error=${is_error} |"
            echo "| Review mode | ${review_mode} |"
            echo "| Reviewable diff | ${changed_files} files, ${patch_lines} patch lines, ${patch_chars} chars (limit ${MAX_REVIEWABLE_BYTES}) |"
            echo "| Permission denials | ${denied} |"
            if [ -n "$denied_detail" ]; then
              echo ""
              echo "<details><summary>Denied tool calls</summary>"
              echo ""
              echo "$denied_detail"
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Warn from 90% of the cap rather than a hardcoded number, so this
          # tracks MAX_TURNS automatically instead of needing a manual re-sync.
          near_cap="$(( MAX_TURNS * 9 / 10 ))"
          if echo "$num_turns" | grep -qE '^[0-9]+$' && [ "$num_turns" -ge "$near_cap" ]; then
            echo "::warning title=Claude PR Review::Used ${num_turns}/${MAX_TURNS} turns — at/near the cap, review may have been cut short"
          else
            echo "::notice title=Claude PR Review::Used ${num_turns}/${MAX_TURNS} turns (\$${cost_usd}, ${duration_ms}ms)"
          fi

      # Fallback for the one case Claude structurally cannot review: a PR
      # that edits claude-pr-review.yml itself. GitHub's workflow-validation
      # guard refuses to mint the OIDC token claude-code-action needs
      # whenever the running workflow file differs from main's copy, so the
      # action always self-skips (exits success, writes no verdict) on such
      # a PR — for ANY reviewable file in the PR, not just the workflow
      # diff. Widened from "workflow is the SOLE reviewable change" (which
      # left real fix PRs like #785/#806 merging with a FAILING required
      # check, since almost no fix to this gate is a workflow-only diff) to
      # "workflow is AMONG the reviewable changes", still gated on the
      # action's own execution_file being empty — proof it never actually
      # attempted a review. A non-empty execution_file means Claude ran but
      # broke its contract by not writing a verdict, which must keep
      # failing loudly rather than being silently waved through. The
      # `steps.claude-review.outcome == 'success'` check is implied by the
      # default step condition (no always()): if the action itself errored,
      # this step is skipped and Enforce review verdict fails as normal.
      #
      # The widened condition auto-passes every reviewable file in the PR,
      # including any that has nothing to do with the workflow — there is
      # no live-review path available for ANY of them once OIDC is refused.
      # `other_reviewable_files` (from the guard step) is surfaced in the
      # log and, when non-empty, as an explicit PR comment, so an author
      # mixing a gate fix with unrelated changes sees plainly that those
      # files were never reviewed rather than reading a silent PASS as a
      # clean bill of health.
      - name: Auto-pass isolated review-gate self-change
        if: steps.guard.outputs.should_review == 'true' && steps.guard.outputs.workflow_gate_changed == 'true' && steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          OTHER_REVIEWABLE_FILES: ${{ steps.guard.outputs.other_reviewable_files }}
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/.claude-review-verdict" ]; then
            echo "Verdict already written — nothing to do."
            exit 0
          fi
          if [ -n "$EXECUTION_FILE" ] && [ -s "$EXECUTION_FILE" ]; then
            echo "Execution file is non-empty — a real review attempt happened without writing a verdict; not auto-passing."
            exit 0
          fi
          echo "claude-pr-review.yml is among this PR's reviewable changes and the action's execution_file is empty — GitHub's OIDC workflow-validation guard made a live review structurally impossible. Auto-passing."
          if [ -n "$OTHER_REVIEWABLE_FILES" ]; then
            echo "Other reviewable files in this PR were ALSO never reviewed: $OTHER_REVIEWABLE_FILES"
            {
              echo "## Claude PR Review — auto-passed, not run"
              echo ""
              echo "This PR edits \`.github/workflows/claude-pr-review.yml\`, so GitHub"
              echo "withheld the OIDC token this gate needs and no live review ran for"
              echo "**any** reviewable file in this PR — not just the workflow diff."
              echo "The following reviewable files were never reviewed by this gate:"
              echo ""
              printf '%s\n' "$OTHER_REVIEWABLE_FILES" | tr ',' '\n' | sed 's/^/- `/;s/$/`/'
              echo ""
              echo "Review them manually before merging."
            } > "$GITHUB_WORKSPACE/.claude-autopass-comment.md"
            gh pr comment "$PR" -R "$REPO" \
              --body-file "$GITHUB_WORKSPACE/.claude-autopass-comment.md" || true
          fi
          printf 'PASS' > "$GITHUB_WORKSPACE/.claude-review-verdict"

      # When the review was skipped (prior PASS still valid), carry that PASS
      # forward so the enforce step below keeps the required check green.
      # Excludes the round-limit case below: that should_review=false does
      # NOT mean the last real verdict was PASS (it could well be FAIL), so
      # it must never be silently carried forward as PASS.
      - name: Carry prior PASS verdict (review skipped)
        if: steps.guard.outputs.should_review != 'true' && steps.guard.outputs.round_limit_reached != 'true'
        run: printf 'PASS' > "$GITHUB_WORKSPACE/.claude-review-verdict"

      # A PR that hasn't converged after MAX_REVIEW_ROUNDS automated review
      # rounds gets handed to a human instead of a 4th+ review — see
      # MAX_REVIEW_ROUNDS' job-env comment and the guard step's round-limit
      # check. Verdict is FAIL (not carried forward as PASS — see above):
      # the gate stays failing until a human either resolves the remaining
      # findings or invokes the override procedure below.
      - name: Escalate to human (review round limit reached)
        if: steps.guard.outputs.round_limit_reached == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ROUND_COUNT: ${{ steps.guard.outputs.review_round_count }}
        run: |
          set -euo pipefail
          {
            echo "## Claude PR Review — round limit reached"
            echo ""
            echo "This PR has already gone through ${ROUND_COUNT} claude[bot] review"
            echo "rounds (limit ${MAX_REVIEW_ROUNDS}) without converging to PASS. Running"
            echo "another automated review is unlikely to help and costs real"
            echo "turns/tokens for little marginal signal, so the loop is escalated to"
            echo "a human instead of running another round."
            echo ""
            echo "If a flagged finding is wrong, see the override procedure in"
            echo "\`docs/contributing/branch-protection.md\`: investigate, reply to the"
            echo "relevant comment thread with evidence, then a human with admin rights"
            echo "merges past the FAIL and records the rationale. This gate does not"
            echo "dispute findings on its own — a human decision is required either way."
            echo ""
            echo "This check stays failing until a human fixes the remaining findings or"
            echo "applies the override."
          } > "$GITHUB_WORKSPACE/.claude-round-limit-comment.md"
          gh pr comment "$PR" -R "$REPO" \
            --body-file "$GITHUB_WORKSPACE/.claude-round-limit-comment.md" || true
          printf 'FAIL' > "$GITHUB_WORKSPACE/.claude-review-verdict"
          echo "::warning title=Claude PR Review::Round limit reached (${ROUND_COUNT}/${MAX_REVIEW_ROUNDS}) — escalated to human, see the override procedure in docs/contributing/branch-protection.md"
          {
            echo "### Claude PR Review — round limit reached"
            echo ""
            echo "Escalated after ${ROUND_COUNT} review rounds (limit ${MAX_REVIEW_ROUNDS}). See the PR comment for the override procedure."
          } >> "$GITHUB_STEP_SUMMARY"

      # Blocking gate (rules 01/04: writer ≠ reviewer). The job fails unless the
      # reviewer explicitly wrote PASS — fail-closed if the review did not run.
      # Requires a branch-protection rule on `main` marking this check required;
      # see docs/contributing/branch-protection.md.
      #
      # `!cancelled()` rather than the default success(): without it this step
      # is SKIPPED whenever the action step fails, which is exactly when its
      # judgement is most needed. On PR #523 the reviewer twice posted a
      # complete, well-formed FAIL and then died on max turns one turn later;
      # both verdicts were discarded and the gate reported infrastructure
      # failure instead of the real finding, costing a full re-run each time.
      #
      # Hence the fallback: if no verdict file exists, read the verdict out of
      # the comment the reviewer already posted — but ONLY if that comment's
      # claude-review-sha marker matches the commit under test. The SHA pin is
      # what keeps this fail-closed: a stale PASS from an earlier push can
      # never satisfy the gate, and a PR author cannot forge a claude[bot]
      # comment. The guard step at the top of this job already trusts this
      # exact signal to skip a review outright, which is a strictly stronger
      # concession than reading a verdict from it.
      - name: Enforce review verdict
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Primary path: bin/lib/pr-review-gate.mjs's resolveVerdict() —
          # unit-tested in bin/tests/pr-review-gate.test.ts. A verdict file
          # the model wrote carries a SHA (see the prompt's Verdict section
          # above) and is rejected as stale unless it matches HEAD_SHA; a
          # bare, unstamped verdict (written by the reject/auto-pass/
          # carry-prior-pass steps, all workflow-authored for this exact
          # commit) is trusted unconditionally. This closes the gap where a
          # verdict file left over from an earlier commit was previously
          # indistinguishable from a fresh one.
          verdict="$(node "$GITHUB_WORKSPACE/bin/pr-review-gate.mjs" resolve-verdict \
            .claude-review-verdict "$HEAD_SHA" || echo "NONE")"

          if [ "$verdict" = "NONE" ]; then
            echo "No trustworthy verdict file — falling back to the posted review comment."
            # gh and jq failures are logged distinguishably from "no comment
            # exists" — the previous `2>/dev/null || true` shape collapsed
            # both into the same silent empty string, the same shape that
            # hid the guard step's --slurp/--jq bug for weeks (see above).
            body=""
            comments_json="$GITHUB_WORKSPACE/.claude-enforce-comments.json"
            fetch_err="$GITHUB_WORKSPACE/.claude-enforce-comments.err"
            if ! gh api "repos/$REPO/issues/$PR/comments" --paginate --slurp \
              > "$comments_json" 2>"$fetch_err"; then
              echo "gh api failed fetching the comment thread: $(cat "$fetch_err" 2>/dev/null)"
            elif ! body="$(jq -r 'add | [.[] | select(.user.login == "claude[bot]")] | last // {} | .body // ""' \
              "$comments_json" 2>"$fetch_err")"; then
              echo "jq failed parsing the comment thread: $(cat "$fetch_err" 2>/dev/null)"
              body=""
            fi
            if [ -z "$body" ]; then
              echo "No claude[bot] comment found (or the fetch above failed)."
            else
              reviewed_sha="$(printf '%s' "$body" \
                | node "$GITHUB_WORKSPACE/bin/pr-review-gate.mjs" parse-sha \
                || echo "")"
              if [ "$reviewed_sha" != "$HEAD_SHA" ]; then
                echo "Latest claude[bot] comment reviewed ${reviewed_sha:-<none>}, not ${HEAD_SHA} — ignoring it."
              else
                comment_verdict="$(printf '%s' "$body" \
                  | node "$GITHUB_WORKSPACE/bin/pr-review-gate.mjs" parse-verdict \
                  || echo "NONE")"
                if [ "$comment_verdict" = "NONE" ]; then
                  echo "Comment for ${HEAD_SHA} has no parseable verdict line."
                else
                  verdict="$comment_verdict"
                  echo "Recovered ${verdict} from the review comment for ${HEAD_SHA}."
                fi
              fi
            fi
          fi

          if [ "$verdict" = "NONE" ]; then
            echo "Claude review verdict: <missing>"
            echo "::error::Claude PR review did not pass (verdict: missing). See the review comment on the PR."
            exit 1
          fi

          echo "Claude review verdict: ${verdict}"
          if [ "$verdict" != "PASS" ]; then
            echo "::error::Claude PR review did not pass (verdict: ${verdict}). See the review comment on the PR."
            exit 1
          fi
