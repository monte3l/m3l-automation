# Builds and deploys the GitHub Pages site (ADR-0032): the visibility-hub
# dashboard at the site root (bin/gen-project-hub.mjs -> dist/index.html)
# plus the AI co-authorship commit-stats endpoint-badge JSON under
# /commit-stats/ (bin/gen-commit-stats-endpoint.mjs, ADR-0032 addendum).
#
# Supersedes pages-commit-stats.yml: GitHub Pages serves one site per repo
# and every deploy replaces the whole site, so both artifacts MUST be
# generated in this single build job and uploaded as one dist/ artifact —
# never split into a second Pages workflow. GITHUB_TOKEN only, no git commit.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # first-deploy verification / manual refresh

permissions:
  contents: read

# GitHub's Pages convention: one deploy group, never cancel a production
# deploy mid-flight (deliberate deviation from ci.yml's cancel-in-progress).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the commit-stats generator counts Co-Authored-By
          # trailers across all of git log and totals via rev-list --count.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # bin/gen-project-hub.mjs only reads bin/lib/script-doc-paths.mjs (build-
      # independent — see that file's header), so nothing here strictly needs
      # packages/m3l-cli/dist today. Building it anyway is a deliberate
      # defense-in-depth: this workflow has no build-order gate the way
      # ci.yml's `gates` lane does (bin/check-verify-parity.mjs only models
      # ci.yml), so a future generator change that reaches for a genuinely
      # CLI-owned symbol (as bin/gen-project-hub.mjs briefly did, breaking
      # every push from 2026-08-26 to 2026-08-27) fails loudly in CI instead
      # of here.
      - name: Build CLI (defense-in-depth for bin/gen-project-hub.mjs)
        run: pnpm turbo run build --filter=@m3l-automation/m3l-cli

      - name: Generate commit-stats endpoint badge JSON
        run: node bin/gen-commit-stats-endpoint.mjs

      - name: Generate visibility-hub dashboard
        run: node bin/gen-project-hub.mjs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
