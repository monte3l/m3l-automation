name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Widens the workflow-level `contents: read` default with `issues: read`
    # — needed only by the push-only "Check hub drift" step at the end of
    # this job (reads Issues/Milestones; never writes). See that step's
    # comment and ADR-0032's 2026-08-13 Update.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Secret scan runs first and independently (rules 05 / security.md):
      # no committed secret should ever reach the build.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Block on HIGH/CRITICAL advisories before spending runner minutes on the
      # rest of the pipeline (rules 05 / security gate requirement).
      - name: Security audit
        run: pnpm audit --audit-level=high

      # Gates outdated majors, deprecated packages, and peer mismatches — the
      # dimensions pnpm audit does not cover (vulnerabilities are above).
      - name: Check dependencies
        run: pnpm check:deps

      # ADR-0036: fails on a non-allow-listed license among m3l-common's
      # runtime dependencies or optional peerDependencies; warns for dev-only
      # tooling. dependency-review.yml's allow-licenses catches a violation
      # earlier, at PR diff time; this catches the resolved state of the tree.
      - name: Check dependency licenses
        run: pnpm check:licenses

      # bin/lib/verify-steps.mjs (the `pnpm verify` aggregate local gate) must
      # track this job's step list exactly, or `pnpm verify` silently stops
      # reproducing what CI actually gates.
      - name: Check verify parity
        run: pnpm check:verify-parity

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: node bin/lint-commit.mjs --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      # Fast-first ordering (rules 05): cheap checks short-circuit the slow ones.
      - name: Lint
        run: pnpm lint

      # Prettier only --write's in the pre-commit hook; this catches drift from
      # any commit that bypassed hooks.
      - name: Format check
        run: pnpm format:check

      - name: Lint Markdown
        run: pnpm lint:md

      - name: Type-check
        run: pnpm typecheck

      # The exports map is the public API contract; fail if it drifted from the
      # committed snapshot without a deliberate update (rules 04 / semver).
      - name: Check public API snapshot
        run: pnpm check:api

      # check:api forces the snapshot to be updated; this forces a BREAKING change
      # to it to be LABELED breaking (a `BREAKING CHANGE:` footer / `!` subject) in
      # the PR commit range. PR-only — it needs the base and head commits.
      - name: Check exports semver labeling
        if: github.event_name == 'pull_request'
        run: node bin/check-exports-semver.mjs --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}

      # Doc-provenance sidecars anchor reference-page headings to source symbols
      # at a git commit. Fail if a heading or symbol is missing; warn on staleness.
      - name: Check doc provenance
        run: pnpm check:provenance

      # Submodule counts in prose must match the files in docs/reference/.
      - name: Check doc counts
        run: pnpm check:doc-counts

      # The CI/CD table in CLAUDE.md must document exactly the workflow files in
      # .github/workflows/ (count + one row each) — no undocumented or stale rows.
      - name: Check workflow docs
        run: pnpm check:workflows-doc

      # The Commands cadence table in CLAUDE.md must match lefthook.yml — each
      # lefthook stage's checks documented exactly, so the cadence can't drift.
      - name: Check cadence docs
        run: pnpm check:cadence

      # Every status-bearing ("## ", has a Status column) table in ROADMAP.md
      # and IMPLEMENTATION.md must be registered with the sync:hub extractor —
      # otherwise a newly added tracker table is a silent no-op forever.
      - name: Check tracker coverage
        run: pnpm check:tracker-coverage

      # Every Status cell in those same tables must be one of ADR-0032's six
      # tracker values — a board-side token ("In review") in a tracker cell
      # classifies as "todo" and leaves shipped work reading as open (#204).
      - name: Check tracker status vocabulary
        run: pnpm check:tracker-status

      # The implemented-count numerator ("N of 22") must match the ✅ rows in
      # docs/implementation-status.md across every badge / prose / HTML site.
      - name: Check implementation count
        run: pnpm check:impl-counts

      # catalog.json, symbol-map.json, and README.md catalog block must match
      # the current docs/reference/ + provenance sidecar state.
      - name: Check reference index
        run: pnpm check:index

      # Run with coverage so the thresholds in vitest.config.ts (packages/*/src)
      # and vitest.bin.config.ts (bin/**/*.mjs) actually gate CI (rules 02):
      # `vitest run` alone never evaluates them.
      - name: Test (with coverage gate)
        run: pnpm test:coverage

      # Per-file test counts recorded in docs/implementation-status.md must match
      # the live suite. This derives them by running Vitest a second time — the
      # duplicate run is deliberate (the coverage gate above cannot emit counts);
      # do not "optimize" it away by folding it into the step above.
      - name: Check test counts
        run: pnpm check:test-counts

      - name: Build
        run: pnpm build

      # Publish correctness (exports map / ESM / types resolution) and
      # dead-code detection. Run after build so the dist/ artifacts exist.
      - name: Check package exports (publint + are-the-types-wrong)
        run: pnpm check:exports

      # Barrel re-export completeness: every src/core|aws/<mod>/index.ts must
      # appear in its namespace barrel and vice-versa. Runs after build so the
      # barrel is proven to compile before we assert it is complete.
      - name: Check barrel re-exports (scaffold)
        run: pnpm check:scaffold

      # Scaffold seam: every src/core|aws/<mod>/index.ts must carry its TDD test
      # file (tests/<mod>.test.ts) and a row in docs/implementation-status.md.
      # Backstop for the scaffolding-submodules scaffolding skill.
      - name: Check scaffold seam (test + status row)
        run: pnpm check:scaffold-seam

      # Consumer-script scaffold: every scripts/<name> package must match the
      # ADR-0022 shape (modular src/, package contract, root tsconfig ref,
      # smoke test, README + contract page) defined in the shared manifest.
      # Deterministic backstop for the scaffolding-scripts skill.
      - name: Check script scaffold conformance
        run: pnpm check:script-scaffold

      # Every scripts/*/package.json must declare exactly the ADR-0029
      # dependency boundary — @m3l-automation/m3l-common via workspace:* and
      # no devDependencies. The @aws-sdk/* import ban (eslint.config.js) is
      # the source-level half of this same rule.
      - name: Check script dependency boundary
        run: pnpm check:script-deps

      # Every public export surfaced through a namespace barrel must be
      # documented — present in its reference page heading or provenance sidecar.
      # Deterministic backstop for the spec-conformance / docs-consistency spokes.
      - name: Check barrel vs docs exports
        run: pnpm check:doc-exports

      # Subagent config: skill/CLAUDE.md references resolve to real agents or
      # built-ins, and no spoke is granted the Agent tool (no-nesting invariant).
      - name: Check subagent configuration (agents)
        run: pnpm check:agents

      # Dynamic-workflow surface (ADR-0025): .claude/workflows/* model/effort
      # choices match the MODEL-MATRIX and every script declares its max-agents
      # guardrail. Distinct from "Check workflow docs" above, which reconciles
      # the CLAUDE.md CI/CD table against .github/workflows/.
      - name: Check dynamic-workflow surface (workflows)
        run: pnpm check:workflows

      # Hook wiring: every .claude/settings.json hook command resolves to a real
      # .claude/hooks/*.mjs, and no hook file is left unwired.
      - name: Check hook wiring (hooks)
        run: pnpm check:hooks

      # GitHub-integration stance (ADR-0030 amendment, 2026-07-27): every
      # GitHub-talking skill cites the governing ADR, carries no retired policy
      # claim, and names the mechanism (gh CLI vs GitHub MCP) it actually uses.
      - name: Check GitHub-integration stance (github-stance)
        run: pnpm check:github-stance

      # ADR-0009/ADR-0035 dependency direction: the import-x/no-restricted-paths
      # layering zones (internal sealing, aws island, core/script root) plus the
      # repo-wide import-x/no-cycle rule are still present and shaped in
      # eslint.config.js — a deleted zone or a deleted no-cycle rule would pass
      # lint silently.
      - name: Check dependency-direction zones (zones)
        run: pnpm check:zones

      # .worktreeinclude hygiene: no tracked files and no unresolvable literal
      # paths, so worktree:setup provisions a fresh worktree correctly.
      - name: Check worktree include
        run: pnpm check:worktree

      # bin/lib/command-catalog.mjs (the pnpm commands data) must have exactly
      # one row per package.json script, in both directions — the non-drift
      # gate for the pnpm commands lister.
      - name: Check command catalog
        run: pnpm check:command-catalog

      # Copy-paste duplication density (ADR-0034) — the one Sonar-style metric
      # not covered by ESLint's per-function complexity rules. CI-only: not
      # in pre-push, to keep that lane's wall-clock unchanged.
      - name: Check code duplication (jscpd)
        run: pnpm check:dup

      - name: Unused files / exports / dependencies (knip)
        run: pnpm knip

      # ADR-0032's visibility hub: docs/ROADMAP.md + IMPLEMENTATION.md must
      # still match GitHub Issues/Milestones. Push-only (not on PRs) — this
      # is a drift ALARM for main, not a merge-blocking gate for unrelated
      # work; the underlying sync itself stays maintainer-local (`pnpm
      # sync:hub -- --apply`), since GITHUB_TOKEN cannot write GitHub
      # Projects v2 (see the ADR). Needs `issues: read`, scoped to this job
      # only (the workflow default stays `contents: read`).
      - name: Check hub drift (push-only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:hub-drift
