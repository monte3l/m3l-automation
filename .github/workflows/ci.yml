name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Split from a single ~45-step serial job into parallel lanes (CI-perf audit,
# CLAUDE.md CI/CD section) — the floor is max(lane), not sum(step), since
# nothing here depends on anything outside its own lane. `verify` aggregates
# the lane results and MUST keep this exact job id: branch protection's
# required status check is named `verify`, not any lane's name.
#
# Path-scoped: the `changes` job classifies what changed (bin/ci-changed-paths.mjs)
# and every other lane/step gates on its outputs, so a docs-only or
# .claude-only change skips the expensive lint/build/test lanes. The
# classifier fails OPEN (defaults every category to true on any error), and
# `verify` treats a `changes` job failure as a hard failure rather than
# letting downstream lanes silently read as "skipped" — see `verify`'s own
# comment.
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ts: ${{ steps.classify.outputs.ts }}
      deps: ${{ steps.classify.outputs.deps }}
      scripts: ${{ steps.classify.outputs.scripts }}
      claude: ${{ steps.classify.outputs.claude }}
      workflows: ${{ steps.classify.outputs.workflows }}
      docs: ${{ steps.classify.outputs.docs }}
      md: ${{ steps.classify.outputs.md }}
      console: ${{ steps.classify.outputs.console }}
    steps:
      # Full history: bin/ci-changed-paths.mjs diffs against an arbitrary
      # base sha (the PR base, or the pre-push sha on a push) that needs to
      # be present in local history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - id: classify
        run: node bin/ci-changed-paths.mjs --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No pnpm install: gitleaks needs only the checked-out tree/history.
      # Not gated on `changes` — a secret can be introduced by any file, and
      # skipping secret scanning based on category is not worth the ~7s.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  deps:
    name: Dependency checks
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      # Block on HIGH/CRITICAL advisories before spending runner minutes on the
      # rest of the pipeline (rules 05 / security gate requirement).
      - name: Security audit
        run: pnpm audit --audit-level=high

      # Gates outdated majors, deprecated packages, and peer mismatches — the
      # dimensions pnpm audit does not cover (vulnerabilities are above).
      - name: Check dependencies
        run: pnpm check:deps

      # ADR-0036: fails on a non-allow-listed license among m3l-common's
      # runtime dependencies or optional peerDependencies; warns for dev-only
      # tooling. dependency-review.yml's allow-licenses catches a violation
      # earlier, at PR diff time; this catches the resolved state of the tree.
      - name: Check dependency licenses
        run: pnpm check:licenses

  # Split from one "Lint" job into two (2026-08-29): typescript-eslint's
  # projectService gives each of eslint's --concurrency worker threads its
  # own independent TypeScript program, so a single `eslint . --concurrency=2`
  # invocation can end up building TWO full copies of packages/m3l-common's
  # program (its files split across both workers) at once — confirmed by
  # memory-profiling `eslint . --concurrency=1` locally at ~4.6GB vs
  # `--concurrency=2` at ~9.0GB, almost exactly double. That pushed a
  # 4-vCPU/16GB runner into ERR_WORKER_OUT_OF_MEMORY after M3LError.ts grew
  # ~370 lines (#734, its cause-allowlist fix) — M3LError.ts sits on nearly
  # every submodule's error hierarchy, so the whole-repo type graph it drives
  # got proportionally bigger. Splitting into two jobs on two separate
  # runners, each --concurrency=1 (so no worker-thread duplication is
  # possible within a job either), profiled at ~3.1GB and ~3.8GB peak —
  # comfortable margin instead of sitting at the ceiling — while running in
  # parallel keeps wall-clock at roughly the slower half (~54s measured
  # locally) rather than adding the two together. Verified the split is
  # exhaustive and non-overlapping: `eslint packages/m3l-common` (409 files)
  # plus `eslint . --ignore-pattern packages/m3l-common/**` (710 files) sums
  # to exactly the unsplit `eslint .` run's 1,119 files, zero overlap.
  lint-library:
    name: Lint (library)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      - name: Lint (library)
        run: pnpm lint:library

  lint-workspace:
    name: Lint (workspace)
    needs: changes
    # ts || claude: eslint also lints .claude/hooks/**/*.mjs
    # (eslint.config.js), so a hooks-only change must not skip this lane.
    if: needs.changes.outputs.ts == 'true' || needs.changes.outputs.claude == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      - name: Lint (workspace)
        run: pnpm lint:workspace

  format:
    name: Format & Markdown
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      # Not path-gated: prettier scans every tracked text extension, so
      # scoping it to one category would rarely skip it anyway. Only
      # Markdown-lint below is narrow enough to gate.
      # Prettier only --write's in the pre-commit hook; this catches drift
      # from any commit that bypassed hooks.
      - name: Format check
        run: pnpm format:check

      - name: Lint Markdown
        if: needs.changes.outputs.md == 'true'
        run: pnpm lint:md

  build:
    name: Build & typecheck
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    # ARM64 adopted (PR 4 trial, see docs/logs/2026-08-24-ci-arm64-runner-adoption.md):
    # ubuntu-24.04-arm measured ~18% faster than ubuntu-latest across 12+
    # runs/arch with zero ARM-specific failures, so it replaced ubuntu-latest
    # as this lane's sole runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      # fetch-depth 0: "Check exports semver labeling" below needs the PR
      # base..head commit range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Persists turbo's local task-output cache across jobs and runs, keyed
      # by lockfile + commit; a restore-keys fallback (OS + lockfile only,
      # ignoring the sha) lets an unchanged package's build/typecheck replay
      # from an earlier commit's cache instead of recompiling. Shared with
      # the `test` lane below, which also invokes `pnpm build` and needs the
      # same cache to avoid a second full compile on its own separate runner.
      # The key intentionally omits `runner.arch`: turbo's cached output here
      # is compiled JS/.d.ts/.tsbuildinfo, not native binaries, so it stays
      # arch-agnostic by design.
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Type-check
        run: pnpm typecheck

      # The exports map is the public API contract; fail if it drifted from the
      # committed snapshot without a deliberate update (rules 04 / semver).
      - name: Check public API snapshot
        run: pnpm check:api

      # ADR-0004's dated Update admits a subpath beyond the three namespace
      # entries only when its whole transitive source-import graph is
      # provably free of node:/third-party imports — this is the machine
      # backstop for that invariant, run against TS source (pre-build) so it
      # sits next to check:api rather than after the build step.
      - name: Check browser-safe exports subpaths
        run: pnpm check:browser-safe-subpath

      # check:api forces the snapshot to be updated; this forces a BREAKING change
      # to it to be LABELED breaking (a `BREAKING CHANGE:` footer / `!` subject) in
      # the PR commit range. PR-only — it needs the base and head commits.
      - name: Check exports semver labeling
        if: github.event_name == 'pull_request'
        run: node bin/check-exports-semver.mjs --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}

      - name: Build
        run: pnpm build

      # Publish correctness (exports map / ESM / types resolution) and
      # dead-code detection. Run after build so the dist/ artifacts exist.
      - name: Check package exports (publint + are-the-types-wrong)
        run: pnpm check:exports

      # Barrel re-export completeness: every src/core|aws/<mod>/index.ts must
      # appear in its namespace barrel and vice-versa. Runs after build so the
      # barrel is proven to compile before we assert it is complete.
      - name: Check barrel re-exports (scaffold)
        run: pnpm check:scaffold

  test:
    name: Test
    needs: changes
    # ts || claude: 8 bin/tests/*.test.ts files import .claude/hooks/*.mjs
    # directly (guard-doc-path, guard-readonly-bash, guard-secret-writes,
    # inject-decision-gate, guard-hub-src-writes, guard-branch-isolation,
    # guard-no-commonjs, guard-eslint-disable), so a hooks-only change must
    # not skip this lane — same reasoning as the `lint` lane's gate below.
    if: needs.changes.outputs.ts == 'true' || needs.changes.outputs.claude == 'true'
    # ARM64 adopted — same rationale as the `build` lane above.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      # Same cache as the `build` lane. `packages/m3l-common`'s package.json
      # `exports` resolves only to `./dist/*` (no source/dev fallback) — every
      # workspace consumer this lane tests (packages/m3l-cli, scripts/*)
      # imports it that way, so a build has to run here too, on this lane's
      # own separate runner. The cache makes that as close to free as turbo
      # allows instead of a second full compile every run.
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      # Run with coverage so the thresholds in vitest.config.ts (packages/*/src)
      # and vitest.bin.config.ts (bin/**/*.mjs) actually gate CI (rules 02):
      # `vitest run` alone never evaluates them.
      - name: Test (with coverage gate)
        run: pnpm test:coverage

  # ADR-0067's X9 row named this decision to make and record: Playwright's
  # CI cost (a full Chromium install + browser runtime) is real enough that
  # every-PR-by-default was rejected. Path-scoped + label-gated instead — a
  # console change always runs it (nothing under packages/m3l-console-{web,
  # server}/** ships unverified), any PR can opt in with the `e2e` label,
  # and every push to main runs it regardless of what that push touched (the
  # same "can't detect drift against a state that hasn't landed yet" reasoning
  # `hub-alarm` already documents for its own push-only trigger).
  e2e:
    name: End-to-end (Playwright)
    needs: changes
    if: needs.changes.outputs.console == 'true' || contains(github.event.pull_request.labels.*.name, 'e2e') || github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      # Playwright's webServer (playwright.config.ts) calls `vite build`
      # directly rather than through turbo, so turbo's `dependsOn: ["^build"]`
      # graph never runs here — this step is the only thing that builds
      # @m3l-automation/m3l-common before Vite needs its dist/ output.
      # console-web has depended on m3l-common since the browser-safe
      # ./core/errors exports subpath (ADR-0004's dated Update): without this,
      # Vite/Rolldown fails to resolve "@m3l-automation/m3l-common/core/errors"
      # because packages/m3l-common/dist/ doesn't exist yet on a fresh runner.
      - name: Build m3l-common
        run: pnpm --filter @m3l-automation/m3l-common build

      # Keyed on the lockfile the same way the turbo cache is — a Playwright
      # version bump changes the lockfile hash and correctly invalidates the
      # installed browser build alongside it.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: packages/m3l-console-web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e suite
        run: pnpm test:e2e

  gates:
    name: Governance gates
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 0: "Validate commit messages" below needs the PR
      # base..head commit range. Not job-gated (unlike deps/lint/build/test):
      # this lane bundles ~24 governance check:* steps whose combined cost is
      # ~20s (see docs/plans/archive/2026-08-19-ci-performance.md's baseline),
      # so none of them are individually path-gated either — four straight
      # review rounds each found a different check whose real file-reads
      # spanned a narrower category than its gate, because a check's true
      # input footprint (a doc it happens to read, a config it happens to
      # validate) can't be exhaustively audited against a 7-category scheme
      # and kept correct as both evolve. Below ~20s of unconditional runtime
      # is a strictly better trade than re-auditing this list every time a
      # check's inputs change. Only the two genuinely event-scoped steps
      # (not path-category-scoped) below keep an `if:`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Some bin/**/*.mjs scripts below (bin/check-script-scaffold.mjs and
      # others) transitively import packages/m3l-cli/dist (ADR-0053 U9), so
      # this lane needs the CLI (and its m3l-common dependency, via turbo's
      # `dependsOn: ["^build"]`) built before any of them run. Scoped to
      # @m3l-automation/m3l-cli rather than the full `pnpm build` — this lane
      # never touches any other package's dist/. Exactly which scripts need
      # this is derived, not hand-listed here — a hand-list already went
      # stale once (it never named bin/gen-project-hub.mjs, which is why
      # Pages broke on every push from 2026-08-26 to 2026-08-27); see the
      # "Check workflow build order" step below.
      - name: Build CLI (scaffold checkers read packages/m3l-cli/dist)
        run: pnpm turbo run build --filter=@m3l-automation/m3l-cli

      # Re-derives the bin/**/*.mjs -> packages/m3l-cli/dist import cone from
      # the actual import graph and asserts every workflow step invoking an
      # in-cone script — in ANY .github/workflows/*.yml file, not just this
      # one — is preceded, in its own job, by a step that builds the CLI.
      # This is the gate that would have caught pages.yml's build-order break
      # (2026-08-26/27) at authoring time instead of on the next push to
      # main.
      - name: Check workflow build order
        run: pnpm check:workflow-build-order

      # bin/lib/verify-steps.mjs (the `pnpm verify` aggregate local gate) must
      # track this file's step names exactly, or `pnpm verify` silently stops
      # reproducing what CI actually gates.
      - name: Check verify parity
        run: pnpm check:verify-parity

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: node bin/lint-commit.mjs --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      # Local reproduction of claude-pr-review.yml's own reviewable-size gate
      # (ADR-0072) — reports the same over-soft-target/over-ceiling verdict
      # the review job would, before that job spends any turn budget.
      - name: Check review size
        if: github.event_name == 'pull_request'
        run: node bin/check-review-size.mjs --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}

      # Doc-provenance sidecars anchor reference-page headings to source symbols
      # at a git commit. Fail if a heading or symbol is missing; warn on staleness.
      - name: Check doc provenance
        run: pnpm check:provenance

      # Submodule counts in prose must match the files in docs/reference/,
      # and the hand-authored barrel TSDoc submodule lists in
      # packages/m3l-common/src/{core,aws}/index.ts (LIST_ASSERTION_SITES).
      - name: Check doc counts
        run: pnpm check:doc-counts

      # The CI/CD table in CLAUDE.md must document exactly the workflow files in
      # .github/workflows/ (count + one row each) — no undocumented or stale rows.
      - name: Check workflow docs
        run: pnpm check:workflows-doc

      # The Commands cadence table in CLAUDE.md must match lefthook.yml — each
      # lefthook stage's checks documented exactly, so the cadence can't drift.
      - name: Check cadence docs
        run: pnpm check:cadence

      # CLAUDE.md is injected in full into every session and every custom
      # subagent launch — guards its always-loaded runtime content (resolving
      # any @-import before measuring, ADR-0078) against silent regrowth past
      # the line/token budget (docs/contributing/model-selection.md's spoke
      # roster is why this repo pays that cost per spoke, not once per
      # session), and ratchets .claude/rules/*.md conditional-load weight.
      - name: Check context budget
        run: pnpm check:context-budget

      # Warns (non-blocking) when docs/research/harness-refresh.md's
      # last-verified date is stale or unset — the self-polling half of the
      # refreshing-anthropic-guidance cadence (ADR-0082).
      - name: Check harness freshness
        run: pnpm check:harness-freshness

      # Every status-bearing ("## ", has a Status column) table in ROADMAP.md
      # and IMPLEMENTATION.md must be registered with the sync:hub extractor —
      # otherwise a newly added tracker table is a silent no-op forever.
      - name: Check tracker coverage
        run: pnpm check:tracker-coverage

      # Every Status cell in those same tables must be one of ADR-0032's six
      # tracker values — a board-side token ("In review") in a tracker cell
      # classifies as "todo" and leaves shipped work reading as open (#204).
      - name: Check tracker status vocabulary
        run: pnpm check:tracker-status

      # Every item key sync:hub derives from those same tables must be unique,
      # case-insensitively and including legacy aliases — a collision makes two
      # unrelated rows share one issue and silently closes the loser (#480).
      - name: Check hub-sync key uniqueness
        run: pnpm check:hub-keys

      # The implemented-count numerator ("N of 22") must match the ✅ rows in
      # docs/implementation-status.md across every badge / prose / HTML site.
      - name: Check implementation count
        run: pnpm check:impl-counts

      # catalog.json, symbol-map.json, and README.md catalog block must match
      # the current docs/reference/ + provenance sidecar state, including the
      # consumer-scripts catalog derived from the union of
      # docs/reference/scripts/ pages AND scripts/ packages.
      - name: Check reference index
        run: pnpm check:index

      # Every public export surfaced through a namespace barrel must be
      # documented — present in its reference page heading or provenance
      # sidecar. Moved here from the `build` lane (it reads src/ and docs/
      # directly, never dist/, so it doesn't need that lane's build step).
      - name: Check barrel vs docs exports
        run: pnpm check:doc-exports

      # Scaffold seam: every src/core|aws/<mod>/index.ts must carry its TDD test
      # file (tests/<mod>.test.ts) and a row in docs/implementation-status.md;
      # while that row is not yet ✅, its docs/reference/<ns>/<mod>.md must also
      # carry a "## Landing plan" heading (ADR-0072). Backstop for the
      # scaffolding-submodules scaffolding skill. Moved here from the `build`
      # lane (it reads src/ and docs/ directly, never dist/).
      - name: Check scaffold seam (test + status row + landing plan)
        run: pnpm check:scaffold-seam

      # Per-file size ratchet (ADR-0072): a src/tests file not in
      # bin/file-budget-baseline.json must stay under its ceiling; a baselined
      # file may shrink but never grow. See ADR-0072 for the rationale — a
      # large implementation file bound to large tests via perFile coverage
      # became structurally un-splittable on core/procedure/B2 (#523).
      - name: Check file budget
        run: pnpm check:file-budget

      # Per-file test counts recorded in docs/implementation-status.md must match
      # the live suite. Derived from `vitest list` — a collection pass, not a
      # full run (see bin/check-test-counts.mjs) — independent of the `test`
      # lane's coverage run, so it doesn't need to live in that lane. Moved
      # here from `test`.
      - name: Check test counts
        run: pnpm check:test-counts

      # Consumer-script scaffold: every scripts/<name> package must match the
      # ADR-0022 shape (modular src/, package contract, root tsconfig ref,
      # smoke test, README + contract page) defined in the shared manifest.
      # Deterministic backstop for the scaffolding-scripts skill; also
      # validates docs/reference/scripts/<name>.md and the root tsconfig.json
      # project reference.
      - name: Check script scaffold conformance
        run: pnpm check:script-scaffold

      # Every script README and reference page must follow the canonical
      # structure spec (docs/contributing/script-docs-structure.md): required
      # sections present, contract blockquotes present, ≥3 examples, Validation
      # column header, Operation column header in Operations at a glance.
      - name: Check script doc structure
        run: pnpm check:script-docs

      # Every scripts/*/package.json must declare exactly the ADR-0029
      # dependency boundary — @m3l-automation/m3l-common via workspace:* and
      # no devDependencies. The @aws-sdk/* import ban (eslint.config.js) is
      # the source-level half of this same rule.
      - name: Check script dependency boundary
        run: pnpm check:script-deps

      # packages/m3l-cli must match the CLI package shape recorded in
      # docs/contributing/cli-structure.md: required files, the src/ layer
      # allowlist, the single bin/ process entry, the bin-first manifest
      # contract, and both tsconfig shapes. ADR-0053 §Governance.
      - name: Check CLI scaffold conformance
        run: pnpm check:cli-scaffold

      # docs/reference/cli.md must follow the canonical structure spec
      # (docs/contributing/cli-structure.md): required sections in canonical
      # order and an `## Exit codes` table — plus a docs<->code cross-check
      # that every command main.ts dispatches is documented. ADR-0053.
      - name: Check CLI doc structure
        run: pnpm check:cli-docs

      # templates/script/*.tmpl must stay prettier-conformant after plain
      # __TOKEN__ substitution, across several token sets — the invariant
      # packages/m3l-cli/src/scaffold/generate.ts depends on, since it emits
      # scaffolded files with no reformatting pass (the CLI's zero-third-
      # party-runtime-dependency contract forbids importing prettier).
      # ADR-0053 U9.
      - name: Check scaffold template format
        run: pnpm check:template-format

      # Subagent config: skill/CLAUDE.md references resolve to real agents or
      # built-ins, and no spoke is granted the Agent tool (no-nesting invariant).
      - name: Check subagent configuration (agents)
        run: pnpm check:agents

      # Dynamic-workflow surface (ADR-0025): .claude/workflows/* model/effort
      # choices match the MODEL-MATRIX and every script declares its max-agents
      # guardrail. Distinct from "Check workflow docs" above, which reconciles
      # the CLAUDE.md CI/CD table against .github/workflows/.
      - name: Check dynamic-workflow surface (workflows)
        run: pnpm check:workflows

      # Hook wiring: every .claude/settings.json hook command resolves to a real
      # .claude/hooks/*.mjs, and no hook file is left unwired.
      - name: Check hook wiring (hooks)
        run: pnpm check:hooks

      # .node-version is the single authority for the dev/CI Node runtime
      # (ADR-0003 amendment): every workspace manifest's engines.node floor
      # agrees with the pin, and every actions/setup-node site in .github/
      # reads `node-version-file: .node-version` rather than a literal. A
      # Node bump touches .node-version, 22 engines fields, 4 workflows and
      # the composite action; before this gate nothing detected a straggler.
      # The script's runtime half (is THIS process on the pinned major?)
      # passes trivially here — a runner provisions from the file this step
      # just validated — and is warn-only for local developers.
      - name: Check Node version pin
        run: pnpm check:node-version

      # GitHub-integration stance (ADR-0030 amendment, 2026-07-27): every
      # GitHub-talking skill cites the governing ADR, carries no retired policy
      # claim, and names the mechanism (gh CLI vs GitHub MCP) it actually uses.
      - name: Check GitHub-integration stance (integration-stance)
        run: pnpm check:integration-stance

      # ADR-0009/ADR-0035 dependency direction: the import-x/no-restricted-paths
      # layering zones (internal sealing, aws island, core/script root) plus the
      # repo-wide import-x/no-cycle rule are still present and shaped in
      # eslint.config.js — a deleted zone or a deleted no-cycle rule would pass
      # lint silently.
      - name: Check dependency-direction zones (zones)
        run: pnpm check:zones

      # .worktreeinclude hygiene: no tracked files and no unresolvable literal
      # paths, so worktree:setup provisions a fresh worktree correctly.
      - name: Check worktree include
        run: pnpm check:worktree

      # bin/lib/command-catalog.mjs (the pnpm commands data) must have exactly
      # one row per package.json script, in both directions — the non-drift
      # gate for the pnpm commands lister.
      - name: Check command catalog
        run: pnpm check:command-catalog

      # Copy-paste duplication density (ADR-0034) — the one Sonar-style metric
      # not covered by ESLint's per-function complexity rules. CI-only: not
      # in pre-push, to keep that lane's wall-clock unchanged.
      - name: Check code duplication (jscpd)
        run: pnpm check:dup

      - name: Unused files / exports / dependencies (knip)
        run: pnpm knip

      # A literal control byte makes a source file binary to git, so it has no
      # diff and cannot be reviewed — while prettier, eslint and gitleaks all
      # stay green (four NUL bytes survived three pushes that way, PR #599).
      # Needs no network or auth, so unlike the hub-alarm job's live-state
      # checks this runs on pull_request too, which is where it has to fire
      # to be useful.
      - name: Check for literal control characters
        run: pnpm check:control-chars

  # Live-GitHub-state drift ALARMS, not merge-blocking gates — deliberately a
  # SEPARATE job from `gates`, not a `needs:` of `verify` (ADR-0079). Each
  # compares a commit against MUTABLE remote state (Issues/Milestones/labels/
  # repo metadata/Projects board) that a merge or a maintainer action can
  # change with no repo commit — `check:hub-drift` specifically races the
  # PR-merge auto-close of its linked issue against the commit that would
  # flip the tracker row, so `main` can go red on ANY push regardless of what
  # that push touched, and no push can ever fix it (the write-back stays
  # maintainer-local: `pnpm sync:hub -- --apply`, since GITHUB_TOKEN cannot
  # write GitHub Projects v2). `continue-on-error` at the job level keeps the
  # signal loud (still visible as a warned job, still failing the CI
  # summary's non-required rollup) without it ever reading as the reason a
  # merge is blocked. Push-only (not on PRs): the PR that introduces drift
  # cannot detect it against a state the merge itself hasn't happened yet —
  # this is a `main`-only alarm by construction, same as ADR-0032 already
  # accepts for the underlying reconcile.
  hub-alarm:
    name: Hub drift alarm (informational, non-blocking)
    needs: changes
    if: github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # ADR-0032's visibility hub: docs/ROADMAP.md + IMPLEMENTATION.md must
      # still match GitHub Issues/Milestones. Not path-gated — a drift alarm
      # for GitHub state, unrelated to what files this push happened to
      # touch.
      - name: Check hub drift (push-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:hub-drift

      # ADR-0050's GitHub platform-feature stance: the live repo's
      # wiki/discussions/issues/projects flags and description/homepage/
      # topics metadata must still match the ADR, and the issue-template
      # config must still link to the Discussions Ideas/Q&A categories.
      # Reads only `GET /repos/{owner}/{repo}` (repo metadata), which every
      # GITHUB_TOKEN can read by default. Deliberately does NOT cover the
      # Projects board's link/visibility/views — those need the `project`
      # OAuth scope GITHUB_TOKEN never carries (see the script's own header).
      - name: Check GitHub platform-feature stance (push-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:github-features

      # ADR-0051's live-label drift gate: every hub-managed label
      # (bin/lib/label-defs.mjs) must exist on the live repo with the exact
      # name/description/color bin/sync-hub-issues.mjs would bootstrap.
      # check:hub-drift only ever inspects an issue's OWN labels against its
      # tracker row, never the label objects themselves — a hand-renamed or
      # hand-deleted managed label went undetected without this.
      - name: Check label drift (push-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:label-drift

      # ADR-0073's board surface: the view set, each view's layout/filter/
      # ordered columns/sort, the built-in Issue Type field, and the
      # Status/Priority option sets, all against bin/lib/hub-views.mjs.
      #
      # GITHUB_TOKEN cannot read Projects v2 at ALL, so in CI this step is
      # expected to take its loud graceful-skip path: it prints each facet it
      # could not verify and exits 0. That is deliberate — a missing
      # capability is not drift. The real enforcement is a maintainer running
      # `pnpm check:hub-views` locally with the `project` scope. The step is
      # wired here anyway so the command stays on the verify/CI inventory
      # (check:verify-parity) and starts failing for real the day a token
      # can read the board.
      - name: Check hub board views (push-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:hub-views

  # The required status check branch protection looks for. Fails if the
  # changes job itself didn't succeed (see comment below), or if any lane
  # failed or was cancelled; passes if every lane succeeded or was
  # deliberately skipped by path-scoping.
  verify:
    name: verify
    needs:
      [
        changes,
        secrets,
        deps,
        lint-library,
        lint-workspace,
        format,
        build,
        test,
        gates,
        e2e,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check lane results
        run: |
          # A `changes` failure must never read as "every lane below it
          # legitimately skipped" — its outputs would be unset, every
          # `needs.changes.outputs.X == 'true'` condition would evaluate
          # false, and every gated lane/step would report "skipped" (which
          # this same check treats as passing) even though nothing was
          # actually verified. Fail hard here instead.
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "The changes (path classification) job did not succeed — treating this as a full failure rather than letting downstream lanes silently read as skipped."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more lanes failed or were cancelled:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All lanes passed or were skipped."
