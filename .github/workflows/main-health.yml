# Opens, updates, or closes a single tracking issue when CI, Pages, or the
# scheduled Skill Evals run fails (or recovers) on `main`. None of the three
# watched workflows can alert on itself going red — this closes the gap seven
# consecutive red pushes over 2.5 hours went unremarked by any automation
# before this (2026-08-26). `hub-alarm` (ci.yml, ADR-0079) deliberately does
# NOT trigger this: it carries `continue-on-error: true`, so a workflow_run
# event for the parent `CI` run still reports `success` even when hub-alarm
# itself failed — that is by design (a non-blocking alarm, not a required
# check), not a gap this workflow needs to separately cover.
#
# Skill Evals (issue #1087, gap #1) added 2026-09-10: it never runs on
# `push` — only `pull_request`, the weekly `schedule` cron, and a deliberate
# `workflow_dispatch` — so the `if:` below accepts those two events too, per
# workflow (see the job-level comment for why the trust boundary still holds).
#
# No pnpm install: bin/notify-main-health.mjs and bin/lib/main-health.mjs use
# only node builtins plus each other and bin/lib/report.mjs (also
# dependency-free), and shell out to `gh`.
name: Main health

on:
  workflow_run:
    workflows: [CI, Pages, Skill Evals]
    types: [completed]

permissions:
  contents: read
  issues: write

# CI and Pages both run on every push to main, and Skill Evals' weekly
# schedule can complete around the same time as either — if two or more
# watched workflows conclude close together, several workflow_run completed
# events fire several notify jobs. Without this, they could concurrently see
# "no existing tracking issue" and each create one, leaving a permanent
# duplicate that findTrackingIssue's single-match lookup can never fully
# reconcile. Queuing (not cancelling) each subsequent run means it re-reads
# live issue state AFTER the prior run's write lands, so it correctly finds
# the issue an earlier run already created instead of racing it.
concurrency:
  group: main-health
  cancel-in-progress: false

jobs:
  notify:
    # head_branch alone is NOT a trust boundary: it is only a branch-name
    # string scoped to head_repository, which can be a fork — an ordinary
    # PR from a fork whose own default branch is literally `main` (the
    # git/GitHub default since ~2020, no malicious intent required)
    # produces a workflow_run completed event with head_branch == 'main'
    # even though the run was against the fork, not this repo's real
    # `main`. Given this job's `issues: write` permission, that PR run's
    # conclusion could otherwise spuriously open/comment on — or, worse,
    # silently close — the real tracking issue. The event-type check below
    # (`push`, `schedule`, or `workflow_dispatch`) rules out every
    # pull_request-triggered run of CI/Pages/Skill Evals (a fork PR run
    # always reports `event == 'pull_request'`) — `schedule` and
    # `workflow_dispatch` are added here only for Skill Evals, which never
    # runs on `push` at all, and neither event type is reachable from a
    # fork PR the way `pull_request` is. The repository-identity check does
    # the remaining trust work for every accepted event type: it rules out a
    # push to a fork's own `main` (which `event == 'push'` alone would not),
    # and equally rules out a fork's own schedule/workflow_dispatch run,
    # since `head_repository.full_name` there can never equal this repo's.
    #
    # Accepting `workflow_dispatch` does widen who can trigger this job's
    # `issues: write` mutation: previously only an actual `push` to `main`
    # (gated by branch protection/PR review) could; now any collaborator
    # with plain write access can manually dispatch `skill-evals.yml` on
    # `main` and have its conclusion open/close the tracking issue. That is
    # accepted as in-scope for this repo's trust model — the same
    # collaborators already have `issues: write` themselves — but it is a
    # real widening, not a free side effect of "closes the last gap."
    if: |
      (
        github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'
      ) &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Notify main health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: node bin/notify-main-health.mjs
