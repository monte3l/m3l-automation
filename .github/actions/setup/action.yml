# Shared checkout + pnpm/Node setup + frozen-lockfile install for ci.yml's
# parallel lanes (deps, lint, format, build, test, gates). The `secrets` lane
# does its own lightweight checkout instead — gitleaks needs no pnpm install,
# so bundling it here would cost every push a needless ~10s.
name: Setup pnpm workspace
description: Checkout, pnpm + Node 24, pnpm store cache, and a frozen-lockfile install.

inputs:
  fetch-depth:
    description: >
      git fetch depth passed to actions/checkout. Lanes housing a PR-diff-range
      step (build's "Check exports semver labeling", gates' "Validate commit
      messages") need '0'; everything else only reads the current tree.
    required: false
    default: "2"

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm

    # Records the runner's real specs in the log so the job-split's assumed
    # 4 vCPU / 16 GB baseline (CLAUDE.md CI perf audit) is verifiable, not
    # inferred.
    - name: Report runner specs
      shell: bash
      run: |
        echo "vCPUs: $(nproc)"
        free -g

    - name: Install (frozen lockfile)
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
