[[IgnoredVulns]]
id = "GHSA-vwc7-r8mq-g2x9"
reason = "adm-zip 0.6.0 (packages/m3l-common devDependency + optional peer) is the latest release; no patched version exists. Advisory covers extractAllTo/extractEntryTo following destination symlinks. packages/m3l-common/src/core/text/zip.ts never calls either API — it uses getEntries()+entry.getData() in memory only, and writes nested entries itself via path.join(mkdtemp(), path.basename(entryName)). adm-zip is also lazily imported (await import(\"adm-zip\")), loaded only if a consumer installs the optional peer. Re-evaluate if zip.ts ever adopts an adm-zip extraction API, or if a patched release ships."
