packages:
  - "packages/*"
  - "scripts/*"
overrides:
  "@typescript-eslint/utils": "^8.62.0"
  "@typescript-eslint/typescript-estree": "^8.62.0"
  "@typescript-eslint/project-service": "^8.62.0"
  "@typescript-eslint/tsconfig-utils": "^8.62.0"
  # Security-advisory pins for vulnerable transitive ranges (2026-07-22,
  # widened 2026-07-25 for GHSA-mh99-v99m-4gvg — a second brace-expansion DoS
  # advisory covering 5.0.7 itself, patched in 5.0.8; widened again 2026-08-06
  # for a third brace-expansion DoS bypassing the 5.0.8 mitigation, plus a
  # fast-uri host-confusion follow-up and a new ip-address SSRF advisory):
  # GHSA brace-expansion DoS x3, linkify-it mailto DoS, fast-uri host
  # confusion x2, ip-address octal/decimal SSRF, @hono/node-server path
  # traversal. Scoped to the vulnerable ranges so unaffected majors resolve
  # untouched; drop once the direct deps catch up. Caret (not >=) so the pin
  # cannot jump a major (linkify-it@6 is ESM-only and breaks mailparser's
  # require chain).
  "brace-expansion@>=3.0.0 <5.0.9": "^5.0.9"
  "linkify-it@<=5.0.1": "^5.0.2"
  "fast-uri@>=3.0.0 <3.1.5": "^3.1.5"
  "ip-address@<=10.3.0": "^10.3.1"
  # cheerio (test-only devDependency) pins undici in the 7.x line.
  "undici@>=7.0.0 <7.29.0": "^7.29.0"
  # packages/m3l-common's own direct `undici` 8.7.0 is also bumped in its own
  # package.json (Dependabot PR #292), but that fix and this file's other
  # overrides land in separate PRs that both gate on a clean `pnpm audit`,
  # creating a merge deadlock — pinned here too so this file's PR can merge
  # on its own; harmless overlap with #292 once it lands. Drop once #292 (or
  # any direct-dependency bump covering it) merges.
  "undici@>=8.0.0 <8.9.0": "^8.9.0"
  "@hono/node-server@<2.0.5": "^2.0.5"
  # @aws-sdk/core 3.977.1 and 3.977.4 are deprecated upstream for a JSON
  # Document number-parsing bug (aws-sdk-js-v3#8246); 3.977.6 carries the fix
  # and is already what most resolved refs use. Range-scoped to the
  # deprecated 3.977.x only — 3.974.27 / 3.975.1 / 3.975.3 are NOT deprecated
  # and must resolve untouched. Drop once the pinned @aws-sdk/client-* deps
  # catch up on their own.
  "@aws-sdk/core@>=3.977.0 <3.977.6": "^3.977.6"
allowBuilds:
  unrs-resolver: false
  lefthook: true
  better-sqlite3: true
# Supply-chain cooldown: hold back package versions younger than this many
# minutes (pnpm's minimumReleaseAge feature). Pinned explicitly rather than
# relying on pnpm v11's default so a future default change cannot silently
# weaken the gate. minimumReleaseAgeExclude is intentionally omitted — it is a
# temporary per-version exemption re-added only when a fresh, must-have bump
# falls inside the window, not a standing list.
minimumReleaseAge: 1440
